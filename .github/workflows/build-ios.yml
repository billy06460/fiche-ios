name: Build iOS (IPA non signee pour AltStore)

# Se lance a chaque envoi sur "main" et a la main (onglet Actions).
# Produit une IPA NON signee + la source AltStore, publiees dans une "Release" GitHub.
# Adresse fixe de la source a ajouter dans AltStore :
#   https://github.com/<proprietaire>/<depot>/releases/latest/download/altstore-source.json
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write   # necessaire pour creer la Release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Choisir la version la plus recente de Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dependances npm
        run: npm install

      - name: Ajouter la plateforme iOS
        run: npx cap add ios

      - name: Installer le plugin Messages natif (maison)
        run: |
          APPDIR=ios/App/App
          # le plugin et l'ecran principal sont ajoutes a AppDelegate.swift
          { echo "import MessageUI"; cat "$APPDIR/AppDelegate.swift"; cat native-ios/SmsComposerPlugin.swift.inc; } > "$RUNNER_TEMP/AppDelegate.swift"
          mv "$RUNNER_TEMP/AppDelegate.swift" "$APPDIR/AppDelegate.swift"
          # l'app demarre sur MainViewController (qui enregistre le plugin)
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MainViewController" customModule="App" customModuleProvider="target"/' "$APPDIR/Base.lproj/Main.storyboard"
          grep -q 'customClass="MainViewController"' "$APPDIR/Base.lproj/Main.storyboard" || { echo "::error::Main.storyboard non modifie"; cat "$APPDIR/Base.lproj/Main.storyboard"; exit 1; }
          # textes d'autorisation (appareil photo / photos)
          PL="$APPDIR/Info.plist"
          set_str() { /usr/libexec/PlistBuddy -c "Delete :$1" "$PL" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PL"; }
          set_str NSCameraUsageDescription "Prendre en photo les dégâts et les tickets carburant."
          set_str NSPhotoLibraryUsageDescription "Ajouter des photos des dégâts à la fiche."
          set_str NSPhotoLibraryAddUsageDescription "Enregistrer des photos de la fiche."

      - name: Generer l'icone de l'app
        run: npx capacitor-assets generate --ios

      - name: Synchroniser le code web et les plugins natifs
        run: npx cap sync ios

      - name: Compiler l'app (sans signature)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.${{ github.run_number }} \
            build

      - name: Creer l'IPA non signee
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "::error::App.app introuvable"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/CarnetDeBord.ipa" Payload)
          ls -l dist
          # icone de la source AltStore (512 px)
          sips -Z 512 resources/icon.png --out dist/icon.png

      - name: Generer la source AltStore
        run: |
          TAG="ios-1.${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python3 native-ios/make_altstore_source.py \
            "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app" \
            dist/CarnetDeBord.ipa \
            "$BASE/CarnetDeBord.ipa" \
            "$BASE/icon.png" \
            dist/altstore-source.json
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publier la Release GitHub (IPA + source AltStore)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/CarnetDeBord.ipa dist/altstore-source.json dist/icon.png \
            --repo "${{ github.repository }}" \
            --title "Carnet de bord iOS 1.${{ github.run_number }}" \
            --notes "IPA non signée pour AltStore. Source : https://github.com/${{ github.repository }}/releases/latest/download/altstore-source.json" \
            --latest
          echo "Source AltStore : https://github.com/${{ github.repository }}/releases/latest/download/altstore-source.json"

      - name: Mettre l'IPA a disposition en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: carnet-de-bord-ios-ipa
          path: dist/
