<title>PREJ Missions</title>
<!-- PREJ Missions : application complète dans ce seul fichier (styles, code et images intégrés). -->
<style>
/* PREJ Missions — reprend l'identité du Carnet de bord (fond ardoise, accent ambre réglable) */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EDEEF0; --panel: #FFFFFF; --panel-2: #F5F6F7; --border: #D7DADE;
  --text: #1A1D21; --text-muted: #62686F;
  --accent: #C9860E; --accent-strong: #A66E0A; --accent-ink: #24160A;
  --danger: #B5392C; --danger-bg: #FBEAE7; --success: #2F7D53; --success-bg: #E8F3EC; --warn-bg: #FBF1DE;
  --radius: 3px;
  --tag: 'Barlow Condensed', 'Roboto Condensed', sans-serif-condensed, 'Arial Narrow', sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --card-glass: rgba(255,255,255,.88);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171A; --panel: #1D2024; --panel-2: #24272C; --border: #34383E;
    --text: #ECEDEE; --text-muted: #9BA1A8;
    --accent: #E6A93A; --accent-strong: #F0BA5A; --accent-ink: #1C1204;
    --danger: #E2685A; --danger-bg: #3A2220; --success: #5BB784; --success-bg: #1E332A; --warn-bg: #3A2F17;
    --card-glass: rgba(28,31,36,.84);
  }
}
:root[data-theme="dark"] {
  --bg: #15171A; --panel: #1D2024; --panel-2: #24272C; --border: #34383E;
  --text: #ECEDEE; --text-muted: #9BA1A8;
  --accent: #E6A93A; --accent-strong: #F0BA5A; --accent-ink: #1C1204;
  --danger: #E2685A; --danger-bg: #3A2220; --success: #5BB784; --success-bg: #1E332A; --warn-bg: #3A2F17;
  --card-glass: rgba(28,31,36,.84);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--body);
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%; overflow-x: hidden;
}
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 60px;
}
.topbar .title { flex: 1; min-width: 0; }
.topbar h1 { font-family: var(--tag); font-weight: 600; font-size: 21px; margin: 0; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sub { color: var(--text-muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; padding: 0;
}
.icon-btn:active { background: var(--panel-2); }
.icon-btn svg { width: 21px; height: 21px; }
.autosave { font-size: 12px; color: var(--success); opacity: 0; transition: opacity .25s; white-space: nowrap; }
.autosave.show { opacity: 1; }

main { max-width: 760px; margin: 0 auto; padding: 14px 12px 130px; }

/* ---------- boutons ---------- */
.btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  padding: 10px 14px; border-radius: var(--radius); font-size: 14.5px; font-weight: 600; cursor: pointer;
  min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-danger { color: var(--danger); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--accent-strong); }
.btn-block { width: 100%; }
.btn-lg { min-height: 54px; font-size: 16px; }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; color: var(--accent-strong); font: inherit; font-weight: 600; padding: 8px 0; cursor: pointer; }

/* ---------- sections / champs ---------- */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
.section { padding: 16px 14px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: 0; }
.section-title { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; }
.section-num { font-family: var(--tag); font-weight: 700; color: var(--accent-strong); font-size: 14px; }
.section-title h3 { font-size: 13px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
.field input, .field select, .field textarea {
  padding: 11px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel-2); color: var(--text); font-size: 16px; width: 100%;
}
.field textarea { resize: vertical; min-height: 96px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.field .hint { font-size: 11.5px; color: var(--text-muted); }
.field.auto input { border-style: dashed; }
.row-input { display: flex; gap: 8px; align-items: center; }
.row-input input { flex: 1; }
.rm-btn {
  width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--danger); font-size: 15px; cursor: pointer;
}
.plate-input { font-family: var(--tag); font-weight: 600; font-size: 19px !important; letter-spacing: 1px; text-transform: uppercase; }
.err { color: var(--danger); font-size: 12.5px; font-weight: 600; }

/* ---------- cases à cocher / choix ---------- */
.checks { display: grid; gap: 8px; }
.check-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 11px 11px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--panel-2); cursor: pointer; user-select: none;
}
.check-item.on { border-color: var(--success); background: var(--success-bg); }
.check-item input { width: 19px; height: 19px; margin: 1px 0 0; accent-color: var(--success); flex-shrink: 0; }
.check-item span { font-size: 14px; font-weight: 600; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button {
  min-height: 52px; padding: 8px; border: 1.5px solid var(--border); border-radius: var(--radius);
  background: var(--panel-2); color: var(--text); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
}
.seg button.on { border-color: var(--accent); color: var(--accent-strong); background: var(--warn-bg); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
.switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; background: var(--border); border-radius: 20px; transition: background .15s; }
.switch .thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--panel); border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked ~ .track { background: var(--accent); }
.switch input:checked ~ .thumb { transform: translateX(18px); }
.state-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.state-pill { padding: 8px 13px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.state-pill[data-lvl="ok"].on { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.state-pill[data-lvl="minor"].on { background: var(--warn-bg); border-color: var(--accent-strong); color: var(--accent-strong); }
.state-pill[data-lvl="damage"].on { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
.reminder { color: var(--danger); font-size: 12.5px; font-weight: 600; margin: -2px 0 8px; }
.km-delta { padding: 8px 10px; background: var(--panel-2); border: 1px dashed var(--border); border-radius: var(--radius); font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.km-delta strong { color: var(--text); font-family: var(--tag); font-size: 16px; }

/* ---------- photos ---------- */
.photo-zone { display: block; border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 16px; text-align: center; cursor: pointer; background: var(--panel-2); color: var(--text-muted); font-size: 13px; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 10px; }
.photo-thumb { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-thumb .rm { position: absolute; top: 3px; right: 3px; width: 30px; height: 30px; border-radius: 50%; background: rgba(20,20,20,.72); color: #fff; border: 0; font-size: 15px; cursor: pointer; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lightbox { position: fixed; inset: 0; background: rgba(10,10,10,.9); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 24px; }
.lightbox img { max-width: 100%; max-height: 100%; }

/* ---------- signature ---------- */
.sig-zone { position: relative; border: 1.5px dashed #9aa3ad; border-radius: var(--radius); background: #fff; touch-action: none; }
.sig-zone canvas { display: block; width: 100%; height: 170px; touch-action: none; }
.sig-zone .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa3ad; pointer-events: none; font-size: 14px; }
.sig-preview { background: #fff; border-radius: var(--radius); height: 56px; display: flex; align-items: center; justify-content: center; padding: 4px; }
.sig-preview img { max-height: 100%; max-width: 100%; }

/* ---------- accueil ---------- */
.welcome { min-height: calc(100vh - 220px); display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 18px; padding: 10px 6px; }
.welcome h2 { font-family: var(--tag); font-size: 30px; font-weight: 600; line-height: 1.05; margin: 0; }
.welcome p { color: var(--text-muted); margin: 0; }
.list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 2px 10px; }
.list-head h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin: 0; }
.mcard {
  display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
}
.mcard.sel { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.mcard .pick { flex: 0 0 54px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-right: 1px solid var(--border); cursor: pointer; }
.mcard .pick span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-muted); display: grid; place-items: center; }
.mcard.sel .pick span { border-color: var(--accent); }
.mcard.sel .pick span::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.mcard .body { flex: 1; min-width: 0; padding: 11px 12px; background: transparent; border: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.om-chip { font-family: var(--tag); font-weight: 600; font-size: 17px; letter-spacing: .5px; padding: 1px 8px; border: 1.5px solid var(--text); border-radius: 2px; background: var(--panel); white-space: nowrap; }
.mcard .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mcard .l2 { color: var(--text-muted); font-size: 12.5px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.dot { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: var(--panel-2); color: var(--text-muted); border: 1px solid var(--border); }
.dot.ok { background: var(--success-bg); color: var(--success); border-color: transparent; }
.dot.part { background: var(--warn-bg); color: var(--accent-strong); border-color: transparent; }
.badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: .4px; }
.badge.sent { background: var(--success-bg); color: var(--success); }
.badge.today { background: var(--warn-bg); color: var(--accent-strong); }

/* ---------- barre d'action fixe ---------- */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--panel); border-top: 1px solid var(--border);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
}
.actionbar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
.actionbar .in > * { flex: 1; }
.actionbar .note { max-width: 760px; margin: 0 auto 6px; font-size: 12px; color: var(--text-muted); text-align: center; }

/* ---------- mission (hub) ---------- */
.mhead { padding: 14px; }
.mhead .l1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.crew { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.crew dt { color: var(--text-muted); }
.crew dd { margin: 0; font-weight: 600; }
.doc {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; margin-bottom: 8px; text-align: left;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); color: inherit; font: inherit; cursor: pointer;
}
.doc .ico { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); color: var(--text-muted); }
.doc.ok .ico { background: var(--success-bg); color: var(--success); }
.doc.part .ico { background: var(--warn-bg); color: var(--accent-strong); }
.doc .ico svg { width: 22px; height: 22px; }
.doc .t { flex: 1; min-width: 0; }
.doc .t strong { display: block; font-size: 15.5px; }
.doc .t span { display: block; font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc .chev { color: var(--text-muted); }

/* ---------- modales ---------- */
.modal-back { position: fixed; inset: 0; z-index: 150; background: rgba(8,9,12,.55); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 620px) { .modal-back { align-items: center; padding: 20px; } }
.modal {
  background: var(--panel); border: 1px solid var(--border); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
  border-radius: 12px 12px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 620px) { .modal { border-radius: var(--radius); } }
.modal h3 { margin: 0 0 8px; font-family: var(--tag); font-size: 22px; font-weight: 600; }
.modal p { margin: 0 0 14px; color: var(--text-muted); font-size: 14px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.modal .actions .btn { flex: 1 1 140px; }
.missing { margin: 0 0 12px; padding: 10px 12px; background: var(--warn-bg); border-radius: var(--radius); font-size: 13.5px; }
.missing ul { margin: 4px 0 0; padding-left: 18px; }
.progress-list { list-style: none; margin: 0; padding: 0; }
.progress-list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.progress-list li:last-child { border-bottom: 0; }
.progress-list .st { width: 24px; flex: 0 0 24px; text-align: center; font-weight: 700; }
.progress-list .st.ok { color: var(--success); }
.progress-list .st.ko { color: var(--danger); }
.progress-list small { display: block; color: var(--text-muted); font-size: 12px; }
.spin { width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.guide-steps { margin: 0 0 12px; padding-left: 20px; font-size: 14px; }
.guide-steps li { margin-bottom: 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; position: relative; overflow: hidden; }
.swatch.sel { outline: 3px solid var(--text); outline-offset: 2px; }
.swatch input { position: absolute; inset: -8px; width: 60px; height: 60px; opacity: 0; cursor: pointer; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.log li { padding: 7px 0; border-bottom: 1px solid var(--border); }
.log li b { display: block; }
.log li.ko b { color: var(--danger); }
.log li.ok b { color: var(--success); }
.preview-img { width: 100%; display: block; background: #fff; border: 1px solid var(--border); }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 13.5px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 400; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.credit { text-align: center; font-size: 11.5px; color: var(--text-muted); opacity: .7; margin-top: 18px; }

/* ---------- accueil : écusson en filigrane, suppression, copyright ---------- */

        ' /Height ' + imgData.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8' +

    var self = this;

    var fontRegularId = this._addObject(strToBytes(
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'
    ));
    var fontBoldId = this._addObject(strToBytes(
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'
    ));

    var pagesId = this._reserveId();

    var pageIds = [];
    this._pages.forEach(function (page) {
      var streamStr = page.content.join('\n');
      var streamBytes = strToBytes(streamStr);
      var contentBody = concatBytes([
        strToBytes('<< /Length ' + streamBytes.length + ' >>\nstream\n'),
        streamBytes,
        strToBytes('\nendstream')
      ]);
      var contentId = self._addObject(contentBody);

      var imgRefs = Object.keys(page.imageIds).map(function (name) {
        return '/' + name + ' ' + page.imageIds[name] + ' 0 R';
      }).join(' ');

      var resources = '<< /Font << /F1 ' + fontRegularId + ' 0 R /F2 ' + fontBoldId + ' 0 R >>' +
        (imgRefs ? ' /XObject << ' + imgRefs + ' >>' : '') + ' >>';

      var pageDict = '<< /Type /Page /Parent ' + pagesId + ' 0 R /Resources ' + resources +
        ' /MediaBox [0 0 ' + fmt(PAGE_W_MM * MM) + ' ' + fmt(PAGE_H_MM * MM) + ']' +
        ' /Contents ' + contentId + ' 0 R >>';

    var pagesBody = '<< /Type /Pages /Kids [' +
      pageIds.map(function (id) { return id + ' 0 R'; }).join(' ') +
      '] /Count ' + pageIds.length + ' >>';

      var post = strToBytes('\nendobj\n');

    var trailerStr = 'trailer\n<< /Size ' + (maxId + 1) + ' /Root ' + catalogId +
      ' 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF';
    chunks.push(strToBytes(trailerStr));

    var full = concatBytes(chunks);

    if (type === 'bytes') return full;
    if (typeof Blob !== 'undefined') return new Blob([full], { type: 'application/pdf' });

<script>
/* ===== Noyau : stockage, réglages, missions ===== */
/* PREJ Missions — noyau commun (stockage, réglages, missions, outils) */
(function () {
  'use strict';
  var P = window.P = {};

  // ---------------------------------------------------------------- stockage
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsJSON(k, def) { try { var r = lsGet(k); return r ? JSON.parse(r) : def; } catch (e) { return def; } }
  P.lsGet = lsGet; P.lsSet = lsSet; P.lsJSON = lsJSON;

  // ---------------------------------------------------------------- réglages
  var SET_KEY = 'prej_settings_v1';
  var SET_DEF = {
    nom: '', qualite: "Chef d'escorte", signature: '',
    fouilleEmail: '', retourEmail: '',
    etab: '', lors: 'extraction', integrale: true, motifs: {},
    theme: 'dark', accent: '#C9860E'
  };
  P.settings = Object.assign({}, SET_DEF, lsJSON(SET_KEY, {}));
  P.saveSettings = function () { return lsSet(SET_KEY, JSON.stringify(P.settings)); };

  // Paramètres responsable du carnet de bord (protégés par mot de passe, comme avant)
  var RESP_KEY = 'prej_carnet_resp_v1';
  P.RESP_PASSWORD = '1402';
  P.resp = Object.assign({ email1: '', email2: '', origin: 'PREJ Marseille', pdfAccent: '#C9860E' }, lsJSON(RESP_KEY, {}));
  P.saveResp = function () { return lsSet(RESP_KEY, JSON.stringify(P.resp)); };

  P.uid = function (p) { return (p || 'm') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); };
  P.pad2 = function (n) { return String(n).padStart(2, '0'); };
  P.todayISO = function () { var d = new Date(); return d.getFullYear() + '-' + P.pad2(d.getMonth() + 1) + '-' + P.pad2(d.getDate()); };
  P.frDate = function (iso) { if (!iso) return ''; var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; };
  P.esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  P.$ = function (sel, root) { return (root || document).querySelector(sel); };
  P.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  P.isAllowedEmail = function (v) { v = String(v || '').trim().toLowerCase(); return /^[^\s@]+@justice\.fr$/.test(v); };
  P.safeName = function (s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^_+|_+$/g, '') || 'sans_numero'; };
  P.nameKey = function (s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .split(/[^a-z0-9]+/).filter(Boolean).sort().join(' ');
  };

  var toastT;
  P.toast = function (msg, ms) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, ms || 2800);
  };

  // Fenêtre modale simple. Renvoie { el, close }.
  P.modal = function (html, opts) {
    opts = opts || {};
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    document.getElementById('modalRoot').appendChild(back);
    function close() { if (back.parentNode) back.parentNode.removeChild(back); if (opts.onClose) opts.onClose(); }
    if (!opts.locked) back.addEventListener('click', function (e) { if (e.target === back) close(); });
    var first = back.querySelector('input, button.btn-primary');
    if (first && opts.focus !== false) setTimeout(function () { try { first.focus(); } catch (e) {} }, 40);
    return { el: back, close: close };
  };
  P.closeModals = function () { document.getElementById('modalRoot').innerHTML = ''; };
  P.confirm = function (title, text, okLabel, cancelLabel) {
    return new Promise(function (resolve) {
      var m = P.modal('<h3>' + P.esc(title) + '</h3><div>' + text + '</div>' +
        '<div class="actions"><button class="btn" data-a="no">' + P.esc(cancelLabel || 'Annuler') + '</button>' +
        '<button class="btn btn-primary" data-a="ok">' + P.esc(okLabel || 'OK') + '</button></div>',
        { onClose: function () { resolve(false); } });
      m.el.querySelector('[data-a="no"]').onclick = function () { m.close(); };
      m.el.querySelector('[data-a="ok"]').onclick = function () { var r = resolve; resolve = function () {}; m.close(); r(true); };
    });
  };

  // ---------------------------------------------------------------- thème et couleur
  function hexToRgb(hex) { var n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgbToHex(rgb) { return '#' + rgb.map(function (c) { c = Math.max(0, Math.min(255, Math.round(c))); return (c < 16 ? '0' : '') + c.toString(16); }).join('').toUpperCase(); }
  function mix(a, b, t) { return [0, 1, 2].map(function (i) { return a[i] + (b[i] - a[i]) * t; }); }
  function lum(rgb) { var c = rgb.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  function inkFor(rgb) { return lum(rgb) > 0.4 ? [24, 20, 16] : [255, 255, 255]; }
  P.validHex = function (v) { return /^#[0-9a-fA-F]{6}$/.test(v || '') ? v.toUpperCase() : ''; };
  P.accentPalette = function (hex) {
    var base = hexToRgb(hex), black = [0, 0, 0], white = [255, 255, 255];
    return {
      base: base, strong: mix(base, black, 0.18), ink: inkFor(base), warnBg: mix(base, white, 0.86),

  };
  P.inkFor = inkFor; P.hexToRgb = hexToRgb;
  P.applyTheme = function (theme, accent) {
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
    var p = P.accentPalette(P.validHex(accent) || '#C9860E');
    var light = '--accent:' + rgbToHex(p.base) + ';--accent-strong:' + rgbToHex(p.strong) + ';--accent-ink:' + rgbToHex(p.ink) + ';--warn-bg:' + rgbToHex(p.warnBg) + ';';
    var dark = '--accent:' + rgbToHex(p.darkBase) + ';--accent-strong:' + rgbToHex(p.darkStrong) + ';--accent-ink:' + rgbToHex(p.darkInk) + ';--warn-bg:' + rgbToHex(p.darkWarnBg) + ';';
    var css = ':root{' + light + '}:root[data-theme="dark"]{' + dark + '}';
    var tag = document.getElementById('accentStyle');
    if (!tag) { tag = document.createElement('style'); tag.id = 'accentStyle'; document.head.appendChild(tag); }
    tag.textContent = css;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#FFFFFF' : '#1D2024');
  };
  P.ACCENTS = [
    { name: 'Ambre', hex: '#C9860E' }, { name: 'Bleu', hex: '#1F5FAD' }, { name: 'Marine', hex: '#1B3A6B' },
    { name: 'Vert', hex: '#2F7D53' }, { name: 'Rouge', hex: '#B5392C' }, { name: 'Orange', hex: '#D0621B' },
    { name: 'Violet', hex: '#6B4FA0' }, { name: 'Ardoise', hex: '#4A5561' }
  ];

  // ---------------------------------------------------------------- missions
  var M_KEY = 'prej_missions_v1';
  var SEL_KEY = 'prej_selected_v1';
  var MAX_MISSIONS = 6;
  P.missions = lsJSON(M_KEY, []);
  if (!Array.isArray(P.missions)) P.missions = [];

  // Protection des données : le nom des personnes détenues est effacé 48 h après la création de la mission
  P.PURGE_MS = 48 * 3600 * 1000;
  P.purgeDetenus = function () {
    var now = Date.now(), changed = false;
    P.missions.forEach(function (m) {
      if (now - (m.createdAt || now) < P.PURGE_MS) return;
      (m.fouilles || []).forEach(function (f) {
        if (f.detenu) { f.detenu = ''; changed = true; m.detenusPurgedAt = now; m.detenusPurgeReason = '48h'; }
      });
    });
    if (changed) P.saveMissions();
    return changed;
  };
  // Supprime les PDF et MMS temporaires de plus de 48 h restés dans le cache de l'application
  P.purgeCache = function () {
    var FS = P.plugin('Filesystem');
    if (!FS) return;
    var limit = Date.now() - P.PURGE_MS;
    ['', 'mms_out', 'sms_attachments'].forEach(function (dir) {
      FS.readdir({ path: dir, directory: 'CACHE' }).then(function (r) {
        (r.files || []).forEach(function (f) {
          if (f.type === 'directory' || !/\.(pdf|pdu|jpg|png)$/i.test(f.name)) return;
          if (Number(f.mtime || 0) && Number(f.mtime) > limit) return;
          FS.deleteFile({ path: (dir ? dir + '/' : '') + f.name, directory: 'CACHE' }).catch(function () {});
        });
      }).catch(function () {});
    });
  };

  P.saveMissions = function () {
    if (P.missions.length > MAX_MISSIONS) {
      P.missions.sort(function (a, b) { return b.createdAt - a.createdAt; });
      P.missions = P.missions.slice(0, MAX_MISSIONS);
    }
    var ok = lsSet(M_KEY, JSON.stringify(P.missions));
    if (!ok) P.toast("Mémoire pleine : supprimez des photos ou d'anciennes missions.", 5000);
    return ok;
  };
  P.getMission = function (id) { return P.missions.find(function (m) { return m.id === id; }) || null; };
  P.getSelected = function () { return lsGet(SEL_KEY) || ''; };
  P.setSelected = function (id) { lsSet(SEL_KEY, id || ''); };

  P.blankFouille = function (m) {
    var s = P.settings;
    return {
      id: P.uid('f'), destination: (m && m.retour && m.retour.juridiction) || '', etablissement: P.resp.origin || s.etab || '',
      detenu: '', lors: s.lors || '', motifs: Object.assign({}, s.motifs || {}), autreTxt: '',
      integrale: s.integrale !== false, obs: ''
    };
  };
  P.newMission = function (data) {

    var chefMatches = s.signature && (!s.nom || P.nameKey(s.nom) === P.nameKey(data.chef));
    var m = {
      id: P.uid('m'), createdAt: Date.now(), date: data.date || P.todayISO(),
      numero: data.numero || '', chauffeur: data.chauffeur || '', chef: data.chef || '',

      chefQualite: chefMatches ? (s.qualite || "Chef d'escorte") : "Chef d'escorte",
      signature: chefMatches ? s.signature : '',
      fouilles: [],
      retour: { priseService: '', priseCharge: '', juridiction: '', depose: '', finMission: '', finService: '', amplitude: '', ampManual: false, infos: '' },
      carnet: {
        plate: '', destination: '', kmStart: '', kmEnd: '', fuelDone: false, fuelKm: '', extraFuels: [],
        equipment: { fuelCard: false, telepeage: false, bouclier: false, pareBalle: false, sac: false, ceinture: false, entrave: false },
        stateLevel: 'ok', stateNotes: '', photos: []

  };

  // ---------------------------------------------------------------- état des documents
  P.MOTIFS = [
    ['evasion', "Présente un risque d'évasion"],
    ['risque', 'Présente un risque pour elle-même ou pour autrui'],

  function filled(v) { return v !== '' && v !== null && v !== undefined && !(typeof v === 'number' && isNaN(v)); }

  P.fouilleMissing = function (f) {

  P.status = function (m) {
    var out = {};

    var fOk = 0;
    (m.fouilles || []).forEach(function (f, i) {
      var x = P.fouilleMissing(f);
      if (!x.length) fOk++;
      else fm.push('Fouille ' + (i + 1) + (f.detenu ? ' (' + f.detenu + ')' : '') + ' : ' + x.join(', '));
    });
    if (!m.signature) fm.push("signature du chef d'escorte");
    var nF = (m.fouilles || []).length;
    out.fouille = {
      state: nF === 0 ? 'empty' : (fm.length === 0 ? 'ok' : (fOk > 0 || nF > 0 ? 'part' : 'empty')),
      label: nF === 0 ? 'Aucune personne détenue' : (fOk + ' / ' + nF + ' complète' + (fOk > 1 ? 's' : '')),
      missing: nF === 0 ? ['aucune décision de fouille'] : fm
    };
    // Fiche retour
    var r = m.retour || {};
    var rm = [];
    if (!r.priseService) rm.push('horaire de prise de service');
    if (!r.finService) rm.push('horaire de fin de service');
    if (!m.signature) rm.push("signature du chef d'escorte");
    var rAny = ['priseService', 'priseCharge', 'juridiction', 'depose', 'finMission', 'finService', 'infos'].some(function (k) { return filled(r[k]); });
    out.retour = { state: rm.length === 0 ? 'ok' : (rAny ? 'part' : 'empty'), label: rm.length ? (rAny ? 'En cours' : 'À remplir') : 'Complète', missing: rm };
    // Carnet
    var c = m.carnet || {};
    var cm = [];
    if (!filled((c.plate || '').trim())) cm.push('immatriculation');
    if (!filled(c.kmStart)) cm.push('kilométrage de départ');
    if (!filled(c.kmEnd)) cm.push('kilométrage de fin');
    var cAny = filled(c.plate) || filled(c.kmStart) || filled(c.kmEnd) || (c.photos || []).length;
    out.carnet = { state: cm.length === 0 ? 'ok' : (cAny ? 'part' : 'empty'), label: cm.length ? (cAny ? 'En cours' : 'À remplir') : 'Complet', missing: cm };
    out.allOk = out.fouille.state === 'ok' && out.retour.state === 'ok' && out.carnet.state === 'ok';
    return out;
  };

  // ---------------------------------------------------------------- natif (Capacitor)
  P.isNative = function () { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); };
  P.plugin = function (name) { return (P.isNative() && window.Capacitor.Plugins) ? window.Capacitor.Plugins[name] || null : null; };

  P.blobToBase64 = function (blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onloadend = function () { var s = String(r.result || ''); var i = s.indexOf(','); resolve(i >= 0 ? s.slice(i + 1) : s); };
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  };
  P.dataUrlToBlob = function (u) {
    var i = u.indexOf(','), mime = (u.slice(0, i).match(/:(.*?);/) || [, 'application/octet-stream'])[1];
    var bin = atob(u.slice(i + 1)), a = new Uint8Array(bin.length);
    for (var k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
    return new Blob([a], { type: mime });
  };

  // Limite des MMS : le PDF ne doit pas dépasser 600 Ko
  P.MAX_PDF = 580 * 1024;
  P.PDF_LEVELS = [{ px: 520, q: 0.8 }, { px: 380, q: 0.65 }, { px: 260, q: 0.5 }, { px: 180, q: 0.4 }];
  // Image -> JPEG aplati sur fond blanc, côté le plus long limité à maxPx
  P.toJpeg = function (src, maxPx, q) {
    return new Promise(function (resolve) {
      if (!src) return resolve(null);
      var im = new Image();
      im.onload = function () {
        var w = im.naturalWidth || 1, h = im.naturalHeight || 1, k = Math.min(1, maxPx / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        resolve({ src: c.toDataURL('image/jpeg', q), el: im, w: w, h: h });
      };
      im.onerror = function () { resolve(null); };
      im.src = src;
    });
  };
  // Construit le PDF au meilleur niveau qui reste sous la limite
  P.buildUnderLimit = function (build) {
    var i = 0, last = null;
    function next() {
      var lv = P.PDF_LEVELS[i];
      return build(lv).then(function (d) {
        last = d;
        if (d.blob.size <= P.MAX_PDF || ++i >= P.PDF_LEVELS.length) return d;
        return next();
      });
    }
    return next().then(function (d) { return d || last; });
  };

  // Écusson de la fiche retour importé par le responsable (stocké à part : image volumineuse)
  var ECU_KEY = 'prej_ecusson_v1';
  P.getEcusson = function () { return lsGet(ECU_KEY) || ''; };
  P.setEcusson = function (url) {
    try { if (url) localStorage.setItem(ECU_KEY, url); else localStorage.removeItem(ECU_KEY); return true; }
    catch (e) { return false; }
  };
  // Prépare une image importée : 600 px max, aplatie sur fond blanc, JPEG
  P.prepareEcusson = function (file) {
    return new Promise(function (resolve, reject) {
      var rd = new FileReader();
      rd.onload = function () {
        var im = new Image();
        im.onload = function () {
          var w = im.naturalWidth || 1, h = im.naturalHeight || 1, k = Math.min(1, 600 / Math.max(w, h));
          var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
          var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.9));
        };
        im.onerror = function () { reject(new Error("Ce fichier n'est pas une image lisible.")); };
        im.src = rd.result;
      };
      rd.onerror = function () { reject(new Error('Lecture du fichier impossible.')); };
      rd.readAsDataURL(file);
    });
  };

  P.copyText = function (t) {
    if (!t) return Promise.resolve();
    var Clip = P.plugin('Clipboard');
    if (Clip) return Clip.write({ string: t }).catch(function () {});

    return Promise.resolve();
  };

  // Partage / enregistrement manuel d'un fichier (secours)
  P.shareFile = function (blob, name, title) {
    var FS = P.plugin('Filesystem'), Share = P.plugin('Share');
    if (FS && Share) {
      return P.blobToBase64(blob).then(function (data) {
        return FS.writeFile({ path: name, data: data, directory: 'CACHE' });
      }).then(function (w) {
        return Share.share({ title: title || name, files: [w.uri], dialogTitle: 'Partager ou enregistrer' });
      }).catch(function (e) {
        var msg = String((e && e.message) || e);
        if (!/cancel/i.test(msg)) P.toast('Partage impossible : ' + msg, 4000);
      });
    }
    try {
      var file = new File([blob], name, { type: blob.type || 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file], title: title || name }).catch(function () {});
      }
    } catch (e) {}
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return Promise.resolve();
  };

  // ---------------------------------------------------------------- pavé de signature
  P.SignaturePad = function (canvas, emptyEl, onChange) {
    var ctx = canvas.getContext('2d'), drawing = false, last = null, self = this;
    this.hasInk = false; this.dirty = false;
    function size() {
      var r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0c1f5c'; ctx.lineWidth = 2.4; ctx.fillStyle = '#0c1f5c';
    }
    function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function setEmpty(v) { if (emptyEl) emptyEl.hidden = !v; }
    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
      drawing = true; last = pos(e);
      ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI * 2); ctx.fill();
      self.hasInk = true; self.dirty = true; setEmpty(false);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drawing) return; e.preventDefault();
      var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      canvas.addEventListener(ev, function () { if (drawing && onChange) onChange(); drawing = false; });
    });
    this.clear = function () { ctx.clearRect(0, 0, canvas.width, canvas.height); self.hasInk = false; self.dirty = true; setEmpty(true); if (onChange) onChange(); };
    this.load = function (dataUrl) {
      size(); self.hasInk = false; setEmpty(true);
      if (!dataUrl) return;
      var im = new Image();
      im.onload = function () {
        var r = canvas.getBoundingClientRect();
        var k = Math.min((r.width - 20) / im.width, (r.height - 20) / im.height, 1);
        var w = im.width * k, h = im.height * k;
        ctx.drawImage(im, (r.width - w) / 2, (r.height - h) / 2, w, h);
        self.hasInk = true; setEmpty(false);
      };
      im.src = dataUrl;
    };
    // Image recadrée sur le tracé (PNG transparent)
    this.toDataURL = function () {
      if (!self.hasInk) return '';
      var w = canvas.width, h = canvas.height, data = ctx.getImageData(0, 0, w, h).data;
      var x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
        if (data[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      if (x1 < 0) return '';
      var m = 6; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
      var tw = x1 - x0 + 1, th = y1 - y0 + 1, k = Math.min(1, 600 / tw);
      var c = document.createElement('canvas'); c.width = Math.round(tw * k); c.height = Math.round(th * k);
      c.getContext('2d').drawImage(canvas, x0, y0, tw, th, 0, 0, c.width, c.height);
      return c.toDataURL('image/png');
    };
    size();
  };

  // Ouvre une fenêtre pour signer. Renvoie une promesse avec l'image (ou null si annulé).
  P.askSignature = function (title, current) {
    return new Promise(function (resolve) {
      var done = false;
      var m = P.modal('<h3>' + P.esc(title) + '</h3>' +
        '<div class="sig-zone"><canvas></canvas><div class="empty">Signez ici avec le doigt</div></div>' +
        '<button class="link" data-a="clear">Effacer</button>' +
        '<div class="actions"><button class="btn" data-a="no">Annuler</button><button class="btn btn-primary" data-a="ok">Enregistrer la signature</button></div>',
        { focus: false, onClose: function () { if (!done) resolve(null); } });
      var pad;
      requestAnimationFrame(function () {
        pad = new P.SignaturePad(m.el.querySelector('canvas'), m.el.querySelector('.empty'));
        pad.load(current || '');
      });
      m.el.querySelector('[data-a="clear"]').onclick = function () { pad && pad.clear(); };
      m.el.querySelector('[data-a="no"]').onclick = function () { m.close(); };
      m.el.querySelector('[data-a="ok"]').onclick = function () {
        var url = pad ? (pad.dirty ? pad.toDataURL() : (current || '')) : '';
        done = true; m.close(); resolve(url);
      };
    });
  };

  P.ICONS = {
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6z"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3zM7 19v2M17 19v2M5 11h14"/></svg>',
    pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'

})();

<script>
/* ===== Décision de fouille ===== */
/* PREJ Missions — Décision de fouille individuelle */
(function () {
  'use strict';
  var P = window.P;
  P.views = P.views || {};

  var REG1_HEAD = 'L. 225-1.';
  var REG1 = " Lorsque les mesures de fouilles des personnes détenues, intégrales ou par palpation, sont réalisées à l'occasion de leur extraction ou de leur transfèrement par l'administration pénitentiaire, elles sont mises en œuvre sur décision du chef d'escorte. Leur nature et leur fréquence sont décidées au vu de la personnalité des personnes détenues intéressées et des circonstances dans lesquelles se déroule l'extraction ou le transfèrement.";
  var REG2_HEAD = 'Art. R. 225-2.';
  var REG2 = " – Les personnes détenues sont fouillées chaque fois qu'il existe des éléments permettant de suspecter un risque d'évasion, l'entrée, la sortie ou la circulation en détention d'objets ou substances prohibés ou dangereux pour la sécurité des personnes ou le bon ordre de l'établissement pénitentiaire.";

  // ---------------------------------------------------------------- écran
  P.views.fouille = function (m, fid, main) {
    if (!m.fouilles.length) { m.fouilles.push(P.blankFouille(m)); P.saveMissions(); }
    var f = m.fouilles.find(function (x) { return x.id === fid; }) || m.fouilles[0];
    var idx = m.fouilles.indexOf(f);

    var chips = m.fouilles.map(function (x, i) {
      return '<button class="state-pill' + (x === f ? ' on' : '') + '" data-lvl="' + (P.fouilleMissing(x).length ? 'minor' : 'ok') + '" data-go="' + x.id + '">' +
        (i + 1) + ' · ' + P.esc(x.detenu || 'Sans nom') + '</button>';
    }).join('') + '<button class="state-pill" data-add="1">+ Ajouter</button>';

    var motifs = P.MOTIFS.map(function (x) {
      var on = f.motifs && f.motifs[x[0]];
      return '<label class="check-item' + (on ? ' on' : '') + '"><input type="checkbox" data-motif="' + x[0] + '"' + (on ? ' checked' : '') + '><span>' + P.esc(x[1]) + '</span></label>' +
        (x[0] === 'autre' ? '<div class="field" id="autreWrap" style="margin:0 0 0 30px;' + (on ? '' : 'display:none') + '"><input type="text" id="f-autre" value="' + P.esc(f.autreTxt) + '" placeholder="Précisez le motif"></div>' : '');
    }).join('');

    main.innerHTML =
      (m.detenusPurgedAt ? '<div class="missing">Les noms des personnes détenues ont été effacés automatiquement ' +
        (m.detenusPurgeReason === 'envoi' ? 'après l\'envoi de la décision de fouille' : '48 h après la création de la mission') + '.</div>' : '') +
      '<div class="state-row" style="margin-bottom:10px">' + chips + '</div>' +
      '<div class="panel">' +
        '<div class="section"><div class="section-title"><span class="section-num">AUTO</span><h3>Rempli depuis la mission</h3></div>' +
          '<dl class="crew">' +
            '<dt>Numéro OM</dt><dd>' + P.esc(m.numero || '—') + '</dd>' +
            '<dt>Décisionnaire</dt><dd>' + P.esc(m.chef || '—') + "</dd>" +
            '<dt>Date</dt><dd>' + P.esc(P.frDate(m.date)) + '</dd>' +
            '<dt>Type de fouille</dt><dd>' + (f.integrale ? 'Intégrale' : '—') + '</dd>' +
            '<dt>Signature</dt><dd>' + (m.signature ? 'Enregistrée' : '<span class="err">À faire sur la page de la mission</span>') + '</dd>' +
          '</dl></div>' +
        '<div class="section"><div class="section-title"><span class="section-num">01</span><h3>Personne détenue</h3></div>' +
          '<div class="field"><label for="f-detenu">Personne détenue</label><input type="text" id="f-detenu" value="' + P.esc(f.detenu) + '" autocapitalize="characters" placeholder="NOM Prénom, n° d\'écrou"></div>' +
          '<div class="field"><label for="f-etab">Établissement</label><input type="text" id="f-etab" value="' + P.esc(f.etablissement) + '"></div>' +
          '<div class="field"><label for="f-dest">À destination de</label><input type="text" id="f-dest" value="' + P.esc(f.destination) + '" placeholder="Tribunal, hôpital…"></div>' +
        '</div>' +
        '<div class="section"><div class="section-title"><span class="section-num">02</span><h3>Lors de</h3></div>' +
          '<div class="seg"><button type="button" data-lors="extraction"' + (f.lors === 'extraction' ? ' class="on"' : '') + '>Départ en extraction judiciaire</button>' +
          '<button type="button" data-lors="transfert"' + (f.lors === 'transfert' ? ' class="on"' : '') + '>Départ en transfert</button></div>' +
        '</div>' +
        '<div class="section"><div class="section-title"><span class="section-num">03</span><h3>Considérant que la personne détenue</h3></div>' +
          '<div class="checks">' + motifs + '</div></div>' +
        '<div class="section"><div class="section-title"><span class="section-num">04</span><h3>Type de fouille</h3></div>' +
          '<label class="check-item' + (f.integrale ? ' on' : '') + '"><input type="checkbox" id="f-integrale"' + (f.integrale ? ' checked' : '') + '><span>Intégrale</span></label></div>' +
        '<div class="section"><div class="section-title"><span class="section-num">05</span><h3>Observations</h3></div>' +
          '<div class="field"><textarea id="f-obs" maxlength="420" aria-label="Observations">' + P.esc(f.obs) + '</textarea></div></div>' +
      '</div>' +
      '<div class="grid2" style="margin-top:12px">' +
        '<button class="btn" id="f-preview">Aperçu</button>' +
        '<button class="btn" id="f-share">Partager le PDF</button>' +
      '</div>' +
      (m.fouilles.length > 1 ? '<button class="btn btn-ghost btn-block" id="f-del" style="color:var(--danger);margin-top:8px">Supprimer cette décision (' + (idx + 1) + ')</button>' : '');

    function save() {
      f.detenu = P.$('#f-detenu').value.trim();
      f.etablissement = P.$('#f-etab').value.trim();
      f.destination = P.$('#f-dest').value.trim();
      f.autreTxt = P.$('#f-autre').value.trim();
      f.obs = P.$('#f-obs').value.trim();
      f.integrale = P.$('#f-integrale').checked;
      f.motifs = {};
      P.$$('[data-motif]').forEach(function (c) { if (c.checked) f.motifs[c.getAttribute('data-motif')] = true; });
      P.touch(m);
    }
    main.addEventListener('input', save);
    main.addEventListener('change', function (e) {
      var t = e.target;
      if (t.type === 'checkbox') t.closest('.check-item').classList.toggle('on', t.checked);
      if (t.getAttribute('data-motif') === 'autre') P.$('#autreWrap').style.display = t.checked ? '' : 'none';
      save();
    });
    P.$$('[data-lors]').forEach(function (b) {
      b.onclick = function () {
        f.lors = f.lors === b.getAttribute('data-lors') ? '' : b.getAttribute('data-lors');
        P.$$('[data-lors]').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-lors') === f.lors); });
        P.touch(m);
      };
    });
    P.$$('[data-go]').forEach(function (b) { b.onclick = function () { P.go('#/m/' + m.id + '/fouille/' + b.getAttribute('data-go'), true); }; });
    P.$('[data-add]').onclick = function () {
      save();
      var nf = P.blankFouille(m);
      nf.destination = f.destination; nf.etablissement = f.etablissement; nf.lors = f.lors;
      m.fouilles.push(nf); P.saveMissions();
      P.go('#/m/' + m.id + '/fouille/' + nf.id, true);
    };

  // ---------------------------------------------------------------- tracé du document (PDF ou image)

  function pdfBackend(doc) {

      measure: function (t) { return doc.getTextWidth(t); },
      line: function (x1, y1, x2, y2, dashed, w) { doc.setLineWidth(w || 0.25); if (dashed) doc.setLineDashPattern([0.4, 0.9], 0); doc.line(x1, y1, x2, y2); if (dashed) doc.setLineDashPattern([], 0); },
      rect: function (x, y, w, h) { doc.setLineWidth(0.3); doc.rect(x, y, w, h); },
      image: function (sig, x, y, w, h) { doc.addImage(sig.src, 'JPEG', x, y, w, h, undefined, 'FAST'); }
    };
  }
  function canvasBackend(s) {
    var c = document.createElement('canvas'); c.width = Math.round(210 * s); c.height = Math.round(297 * s);
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.textBaseline = 'alphabetic';
    return {
      canvas: c,
      font: function (pt, st) { var p = st === 'bold' ? 'bold ' : st === 'italic' ? 'italic ' : ''; ctx.font = p + (pt * 0.3528 * s) + 'px Helvetica, Arial, sans-serif'; },
      text: function (t, x, y) { if (t) ctx.fillText(t, x * s, y * s); },
      measure: function (t) { return ctx.measureText(t).width / s; },
      line: function (x1, y1, x2, y2, dashed, w) { ctx.save(); ctx.lineWidth = (w || 0.25) * s; ctx.setLineDash(dashed ? [0.4 * s, 0.9 * s] : []); ctx.beginPath(); ctx.moveTo(x1 * s, y1 * s); ctx.lineTo(x2 * s, y2 * s); ctx.stroke(); ctx.restore(); },
      rect: function (x, y, w, h) { ctx.save(); ctx.lineWidth = 0.3 * s; ctx.strokeRect(x * s, y * s, w * s, h * s); ctx.restore(); },
      image: function (sig, x, y, w, h) { ctx.drawImage(sig.el, x * s, y * s, w * s, h * s); }
    };
  }
  function wrap(b, str, maxW) {
    var out = [];

      var words = par.split(/\s+/).filter(Boolean), line = '';

          var i = w.length; while (i > 1 && b.measure(w.slice(0, i)) > maxW) i--;

    function label(t, x, y) { b.font(10.5, 'bold'); b.text(t, x, y); var w = b.measure(t); b.line(x, y + 0.8, x + w, y + 0.8, false, 0.25); return w; }
    function field(t, x, y, val, maxX) {
      var lw = label(t, x, y); b.font(10.5, 'normal');
      var lines = wrap(b, val, maxX - (x + lw + 2.5));
      lines.forEach(function (l, i) { b.text(l, x + lw + 2.5, y + i * 4.8); });

    }
    if (d.logo) { var lw = 30; b.image(d.logo, M, 10, lw, lw * d.logo.h / d.logo.w); }
    else {
      b.font(8.5, 'bold'); b.text('MINISTÈRE', M, 16); b.text('DE LA JUSTICE', M, 19.8);
      b.font(5.5, 'italic'); b.text('Liberté', M, 23.2); b.text('Égalité', M, 25.6); b.text('Fraternité', M, 28);

    label('Motivation de la décision :', M, y); y += 7;

      var s = x[0] === 'autre' ? (d.motifs.autre && d.autreTxt ? 'Autre (précisez) : ' + d.autreTxt : 'Autre (précisez)') : x[1];
      box(M + 4, y, d.motifs[x[0]]);

      y += lines.length * 4.8 + 2;
    });
    y += 2.5;
    b.text('Type de fouille :', M, y); y += 7;

    y += 3;
    label('Réglementation :', M, y); y += 6;
    function para(head, body) {

      var lines = wrap(b, head + body, W);
      lines.forEach(function (l, i) { b.text(l, M, y + i * 3.5); });
      b.line(M, y + 0.6, M + b.measure(head), y + 0.6, false, 0.2);
      y += lines.length * 3.5 + 3.5;
    }
    para(REG1_HEAD, REG1); para(REG2_HEAD, REG2);

    y = Math.max(y + 4, 228);
    b.font(10.5, 'normal'); b.text('Le ' + d.dateStr, M, y + 6);
    var X = 112;
    b.text("Le ou la Che(ffe) d'escorte", X, y);
    b.font(10.5, 'bold'); b.text(d.signName, X, y + 5);
    b.font(9.5, 'italic'); var q = wrap(b, d.qual, R - X); q.slice(0, 2).forEach(function (l, k) { b.text(l, X, y + 9.5 + k * 4.2); });
    if (d.sig) {
      var top = y + 9.5 + Math.min(2, q.length) * 4.2 - 1, maxW = 60, maxH = Math.min(24, 290 - top);
      var r = Math.min(maxW / d.sig.w, maxH / d.sig.h); b.image(d.sig, X, top, d.sig.w * r, d.sig.h * r);
    }
  }

  P.loadImage = function (src) {
    return new Promise(function (resolve) {
      if (!src) return resolve(null);

      im.onload = function () { resolve({ src: src, el: im, w: im.naturalWidth || 1, h: im.naturalHeight || 1 }); };
      im.onerror = function () { resolve(null); };

  function data(m, f, sig, logo) {

      dec: m.chef, om: m.numero, dest: f.destination, etab: f.etablissement, detenu: f.detenu,
      lors: f.lors, motifs: f.motifs || {}, autreTxt: f.autreTxt, integrale: f.integrale, obs: f.obs,

  // Un seul PDF : une page par personne détenue

        if (i > 0) doc.addPage();
        drawDoc(pdfBackend(doc), data(m, f, sig, logo));
