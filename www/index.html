    return doc;
  }

  function imageSize(u) { return new Promise(function (r) { var i = new Image(); i.onload = function () { r({ w: i.naturalWidth || 1, h: i.naturalHeight || 1 }); }; i.onerror = function () { r(null); }; i.src = u; }); }

  function footer(doc) {
    var C = pdfColors(), pageW = 210, pageH = 297, margin = 14, total = doc.internal.getNumberOfPages();
    for (var p = 1; p <= total; p++) {
      doc.setPage(p);
      draw(doc, C.border); doc.setLineWidth(0.2); doc.line(margin, pageH - 12, pageW - margin, pageH - 12);
      ink(doc, C.muted); doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
      doc.text('Carnet de bord — Gestion de parc ' + (P.resp.origin || 'PREJ Marseille'), margin, pageH - 7);
      doc.text('Page ' + p + ' / ' + total, pageW - margin, pageH - 7, { align: 'right' });
    }
  }

  // Fiche + photos en annexe (une par page) dans un seul PDF
  P.buildCarnetPdf = function (m) {
    var c = m.carnet, photos = c.photos || [];
    return Promise.all(photos.map(function (p) { return preparePhoto(p.dataUrl); })).then(function (prepared) {
      var doc = buildStyled(m, c, prepared);
      return Promise.all(photos.map(function (p) { return imageSize(p.dataUrl); })).then(function (sizes) {
        var margin = 12, pageW = 210, pageH = 297;
        var t = 'Fiche ' + (m.numero ? m.numero + ' - ' : '') + (c.plate || '');
        photos.forEach(function (p, i) {
          doc.addPage();
          doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(26, 29, 33);
          doc.text('Annexe  —  ' + t + '  —  Photo ' + (i + 1) + ' / ' + photos.length, margin, margin + 4);
          var s = sizes[i] || { w: 4, h: 3 }, bw = pageW - margin * 2, bh = pageH - margin * 2 - 22;
          var k = Math.min(bw / s.w, bh / s.h), w = s.w * k, h = s.h * k;
          try { doc.addImage(prepared[i] != null ? prepared[i] : p.dataUrl, 'AUTO', margin + (bw - w) / 2, margin + 10, w, h); } catch (e) {}
        });
        footer(doc);
        return { blob: doc.output('blob'), name: 'Carnet_de_bord_OM-' + P.safeName(m.numero) + '_' + (P.safeName(c.plate) || '') + '.pdf' };
      });
    });
  };

  P.carnetBodyText = function (m) {
    var c = m.carnet, eq = c.equipment || {}, L = [];
    L.push('Fiche mission — ' + (c.plate || 'Sans plaque'));
    L.push('Unité : ' + (P.resp.origin || 'PREJ Marseille'));
    L.push('');
    if (m.numero) L.push('Numéro de mission : ' + m.numero);
    L.push('Date : ' + P.frDate(m.date));
    if (c.destination) L.push('Destination : ' + c.destination);
    L.push('Chauffeur : ' + (m.chauffeur || '-'));
    L.push('Kilométrage départ : ' + fmtKm(c.kmStart));
    L.push('Kilométrage fin : ' + fmtKm(c.kmEnd));
    if (c.kmStart !== '' && c.kmEnd !== '' && !isNaN(c.kmStart) && !isNaN(c.kmEnd)) L.push('Distance parcourue : ' + fmtKmNumber(Number(c.kmEnd) - Number(c.kmStart)) + ' km');
    L.push('Plein effectué : ' + fuelSummary(c));
    L.push(''); L.push('Équipement présent :');
    EQ.forEach(function (x) { L.push('- ' + x[1] + ' : ' + (eq[x[0]] ? 'Oui' : 'Non')); });
    L.push(''); L.push('État du véhicule : ' + (STATES[c.stateLevel] || '-'));
    L.push('Remarques : ' + (c.stateNotes || '(aucune)'));
    L.push('');
    L.push((c.photos && c.photos.length) ? '(Fiche PDF en pièce jointe, avec ' + c.photos.length + ' photo(s) en annexe)' : '(Fiche PDF en pièce jointe)');
    return L.join('\n');
  };
})();

</script>

<script>
/* ===== Envoi par MMS ===== */
/* PREJ Missions — envoi des documents d'une mission par MMS */
(function () {
  'use strict';
  var P = window.P;

  // ---------------------------------------------------------------- journal
  var LOG_KEY = 'prej_send_log_v1';
  P.getLog = function () { return P.lsJSON(LOG_KEY, []); };
  function addLog(entries) { P.lsSet(LOG_KEY, JSON.stringify(entries.concat(P.getLog()).slice(0, 30))); }

  // ---------------------------------------------------------------- autorisation SMS (repris du carnet)
  function sms() { return P.plugin('SmsComposer'); }
  P.isSmsGranted = function () {
    var S = sms();
    if (!S || typeof S.checkPermissions !== 'function') return Promise.resolve(true);
    return S.checkPermissions().then(function (r) { return !!r && r.sms === 'granted'; }).catch(function () { return false; });
  };
  function requestSms() {
    var S = sms();
    if (!S || typeof S.requestPermissions !== 'function') return Promise.resolve(false);
    return S.requestPermissions({ permissions: ['sms'] }).then(function (r) { return !!r && r.sms === 'granted'; }).catch(function () { return false; });
  }
  var waitingReturn = false, guideAttempts = 0, afterGrant = null;
  P.startSmsSetup = function (then) {
    afterGrant = then || null;
    requestSms().then(function (ok) { if (ok) smsDone(); else showGuide(); });
  };
  function smsDone() {
    waitingReturn = false; guideAttempts = 0;
    P.closeModals(); P.toast('Envoi automatique activé.', 3500);
    if (P.refreshHome) P.refreshHome();
    var f = afterGrant; afterGrant = null; if (f) f();
  }
  function showGuide() {
    P.closeModals();
    var extra = guideAttempts > 0
      ? '<p>L\'option n\'apparaît pas dans le menu ⋮ ? Ouvrez d\'abord <b>Autorisations &gt; SMS</b> et appuyez sur <b>Autoriser</b> : Android affiche un avertissement, fermez-le, puis revenez à la page précédente et réessayez le menu ⋮.</p>'
      : '';
    var m = P.modal('<h3>Activer l\'envoi automatique</h3>' +
      '<p>Android bloque l\'autorisation SMS pour les applications installées hors du Play Store. Une seule manipulation suffit :</p>' +
      '<ol class="guide-steps"><li>Appuyez sur <b>Ouvrir les réglages</b>.</li>' +
      '<li>Sur la page qui s\'ouvre, touchez les <b>⋮</b> en haut à droite puis <b>Autoriser les paramètres restreints</b>, et confirmez.</li>' +
      '<li>Revenez dans PREJ Missions : l\'application redemande l\'autorisation SMS, appuyez sur <b>Autoriser</b>.</li></ol>' + extra +
      '<div class="actions"><button class="btn" data-a="later">Plus tard</button><button class="btn btn-primary" data-a="open">Ouvrir les réglages</button></div>');
    m.el.querySelector('[data-a="later"]').onclick = function () { waitingReturn = false; afterGrant = null; m.close(); };
    m.el.querySelector('[data-a="open"]').onclick = function () {
      var S = sms();
      if (!S) return;
      waitingReturn = true;
      S.openAppSettings().catch(function (e) { waitingReturn = false; P.toast('Ouvrez Paramètres > Applications > PREJ Missions.', 5000); });
    };
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (waitingReturn) {
      waitingReturn = false;
      setTimeout(function () { requestSms().then(function (ok) { if (ok) smsDone(); else { guideAttempts++; showGuide(); } }); }, 400);
    } else if (P.refreshHome) P.refreshHome();
  });

  // ---------------------------------------------------------------- contenu des messages
  function fouilleBody(m) {
    return 'Décision(s) de fouille — OM ' + (m.numero || '-') + ' — ' + P.frDate(m.date) + '\n' +
      "Chef d'escorte : " + (m.chef || '-') + '\n' +
      'Personne(s) détenue(s) : ' + (m.fouilles.map(function (f) { return f.detenu || '?'; }).join(', ') || '-') + '\n' +
      '(PDF en pièce jointe)';
  }
  function retourBody(m) {
    var r = m.retour;
    return 'Fiche retour mission — OM ' + (m.numero || '-') + ' — ' + P.frDate(m.date) + '\n' +
      "Chef d'escorte : " + (m.chef || '-') + ' — Chauffeur : ' + (m.chauffeur || '-') + '\n' +
      'Service : ' + (r.priseService || '?') + ' → ' + (r.finService || '?') + (r.amplitude ? ' (' + r.amplitude + ')' : '') + '\n' +
      '(PDF en pièce jointe)';
  }

  function jobsFor(m) {
    var s = P.settings, jobs = [];
    if (m.fouilles.length) jobs.push({
      key: 'fouille', label: 'Décision' + (m.fouilles.length > 1 ? 's' : '') + ' de fouille (' + m.fouilles.length + ')',
      to: [s.fouilleEmail].filter(Boolean), subject: 'Décision de fouille - OM ' + (m.numero || ''),
      body: fouilleBody(m), build: function () { return P.buildFouillePdf(m); }
    });
    jobs.push({
      key: 'retour', label: 'Fiche retour mission', to: [s.retourEmail].filter(Boolean),
      subject: 'Fiche retour mission - OM ' + (m.numero || ''), body: retourBody(m),
      build: function () { return P.buildRetourPdf(m); }
    });
    jobs.push({
      key: 'carnet', label: 'Carnet de bord', to: [P.resp.email1, P.resp.email2].filter(Boolean),
      subject: ('Fiche mission ' + (m.carnet.plate || '') + (m.numero ? ' - ' + m.numero : '')).trim(),
      body: P.carnetBodyText(m), build: function () { return P.buildCarnetPdf(m); }
    });
    return jobs;
  }

  // ---------------------------------------------------------------- lancement
  P.sendMission = function (m) {
    if (P.sending) { P.toast('Envoi déjà en cours…'); return; }
    var jobs = jobsFor(m);
    var noDest = jobs.filter(function (j) { return !j.to.length || j.to.some(function (e) { return !P.isAllowedEmail(e); }); });
    if (noDest.length) {
      P.confirm('Destinataires à renseigner',
        '<p>Aucune adresse @justice.fr valide pour : <b>' + noDest.map(function (j) { return P.esc(j.label); }).join(', ') + '</b>.</p>' +
        '<p>Renseignez-les dans la roue dentée, rubrique « Destinataires » (mot de passe responsable).</p>',
        'Ouvrir les réglages', 'Plus tard').then(function (ok) { if (ok) P.go('#/reglages'); });
      return;
    }
    var st = P.status(m);
    var miss = [];
    [['fouille', 'Décision de fouille'], ['retour', 'Fiche retour mission'], ['carnet', 'Carnet de bord']].forEach(function (k) {
      if (st[k[0]].missing.length) miss.push('<li><b>' + k[1] + '</b> : ' + st[k[0]].missing.map(P.esc).join(' ; ') + '</li>');
    });
    var go = function () { run(m, jobs); };
    if (!miss.length) return confirmSend(m, jobs).then(function (ok) { if (ok) go(); });
    P.confirm('Documents incomplets', '<div class="missing">Il manque :<ul>' + miss.join('') + '</ul></div><p>Envoyer quand même ?</p>',
      'Envoyer quand même', 'Compléter').then(function (ok) { if (ok) go(); });
  };

  function confirmSend(m, jobs) {
    var list = jobs.map(function (j) { return '<li><b>' + P.esc(j.label) + '</b> → ' + P.esc(j.to.join(', ')) + '</li>'; }).join('');
    return P.confirm('Envoyer la mission ' + (m.numero || ''),
      (sms() ? '<p>Les PDF partent par MMS, sans ouvrir Messages :</p>'
        : '<p>Chaque PDF s\'envoie depuis le menu Partager du téléphone. L\'adresse du destinataire est copiée à chaque fois :</p>') +
      '<ul style="padding-left:18px;font-size:14px">' + list + '</ul>',
      'Envoyer', 'Annuler');
  }

  function row(j) {
    return '<li data-k="' + j.key + '"><span class="st"><span class="spin"></span></span><div><b>' + P.esc(j.label) + '</b><small>En attente…</small></div></li>';
  }
  function setRow(el, k, state, text) {
    var li = el.querySelector('[data-k="' + k + '"]');
    if (!li) return;
    var st = li.querySelector('.st');
    st.className = 'st' + (state === 'ok' ? ' ok' : state === 'ko' ? ' ko' : '');
    st.innerHTML = state === 'ok' ? '✓' : state === 'ko' ? '✗' : '<span class="spin"></span>';
    li.querySelector('small').textContent = text;
  }

  function run(m, jobs) {
    P.sending = true;
    var dlg = P.modal('<h3>Envoi en cours</h3><p>' + (sms()
        ? 'Gardez l\'application ouverte et les données mobiles activées. Chaque MMS peut prendre jusqu\'à une minute.'
        : 'Touchez « Envoyer avec le raccourci » si le raccourci « Envoyer PREJ » est installé. Sinon, touchez « Partager » pour chaque document et collez l\'adresse copiée dans « À ».') + '</p>' +
      '<ul class="progress-list">' + jobs.map(row).join('') + '</ul><div class="actions" id="sendActions" hidden></div>', { locked: true, focus: false });
    var el = dlg.el, results = [], native = !!sms();
    var chain = Promise.resolve();

    if (!native) {
      // Navigateur (iPhone, Safari) : un partage par document, chacun lancé par un appui
      chain = Promise.all(jobs.map(function (j) { return j.build(); })).then(function (docs) {
        jobs.forEach(function (j, i) { j.doc = docs[i]; setRow(el, j.key, 'run', 'PDF prêt : touchez « Partager »'); });
        return webShareSteps(jobs, el, results);
      }).catch(function (e) {
        var msg = String((e && e.message) || e);
        jobs.forEach(function (j) { if (!results.some(function (r) { return r.job === j; })) { results.push({ job: j, ok: false, info: msg }); setRow(el, j.key, 'ko', msg); } });
      });
    } else {
      jobs.forEach(function (j) {
        chain = chain.then(function () {
          setRow(el, j.key, 'run', 'Création du PDF…');
          return j.build();
        }).then(function (doc) {
          j.doc = doc;
          setRow(el, j.key, 'run', 'Envoi du MMS à ' + j.to.join(', ') + '…');
          return P.blobToBase64(doc.blob).then(function (b64) {
            return sms().sendMms({ to: j.to, subject: j.subject, body: j.body, attachments: [{ name: doc.name, data: b64 }] });
          });
        }).then(function (res) {
          var rs = (res && res.results) || [];
          var bad = rs.filter(function (r) { return !r.ok; });
          var good = rs.filter(function (r) { return r.ok; });
          results.push({ job: j, ok: !bad.length, results: rs, failedTo: bad.map(function (r) { return r.to; }),
            info: bad.length ? bad.map(function (r) { return r.to + ' — ' + (r.error || 'code ' + r.code); }).join(' ; ') : 'Envoyé à ' + good.map(function (r) { return r.to; }).join(', ') });
          setRow(el, j.key, bad.length ? 'ko' : 'ok', results[results.length - 1].info);
        }).catch(function (e) {
          if (e && e.code === 'PERMISSION_DENIED') throw e;
          var msg = String((e && (e.message || e.errorMessage)) || e);
          results.push({ job: j, ok: false, failedTo: j.to, info: msg });
          setRow(el, j.key, 'ko', msg);
        });
      });
    }

    chain.then(function () { finish(m, jobs, results, el, dlg); }).catch(function (e) {
      P.sending = false; dlg.close();
      if (e && e.code === 'PERMISSION_DENIED') { P.startSmsSetup(function () { P.sendMission(m); }); return; }
      P.toast('Envoi interrompu : ' + String((e && e.message) || e), 5000);
    });
  }

  // Partage un PDF par appui : Safari n'autorise qu'un menu Partager par geste de l'utilisateur
  P.SHORTCUT_NAME = 'Envoyer PREJ';
  P.openUrl = function (u) { window.location.href = u; };

  function webShareSteps(jobs, el, results) {
    // Les PDF sont convertis à l'avance : la copie dans le presse-papiers doit partir dès l'appui
    return Promise.all(jobs.map(function (j) { return P.blobToBase64(j.doc.blob); })).then(function (b64s) {
      var payload = JSON.stringify({ v: 1, docs: jobs.map(function (j, i) {
        return { doc: j.key, to: j.to, name: j.doc.name, subject: j.subject || j.label, body: j.body || '', pdf: b64s[i] };
      }) });
      return webShareButtons(jobs, el, results, payload);
    });
  }

  function webShareButtons(jobs, el, results, payload) {
    return new Promise(function (resolve) {
      var act = el.querySelector('#sendActions');
      var done = {};
      act.innerHTML =
        '<button class="btn btn-primary" data-wshortcut style="grid-column:1/-1;width:100%;flex-basis:100%">Envoyer avec le raccourci</button>' +
        '<div data-wask hidden style="grid-column:1/-1;width:100%;flex-basis:100%;display:flex;flex-direction:column;gap:8px">' +
          '<p style="margin:0">Le raccourci a-t-il envoyé les documents ?</p>' +
          '<div style="display:flex;gap:8px"><button class="btn btn-primary" data-wyes style="flex:1">Oui, tout est parti</button>' +
          '<button class="btn" data-wno style="flex:1">Non</button></div></div>' +
        jobs.map(function (j, i) {
          return '<button class="btn" data-wshare="' + i + '">Partager : ' + P.esc(j.label) + '</button>';
        }).join('') + '<button class="btn" data-wend>Terminer</button>';
      act.hidden = false;
      var ask = act.querySelector('[data-wask]');
      act.querySelector('[data-wshortcut]').onclick = function () {
        var go = function () {
          jobs.forEach(function (j) { setRow(el, j.key, 'run', 'Transmis au raccourci « ' + P.SHORTCUT_NAME + ' »…'); });
          ask.hidden = false;
          P.openUrl('shortcuts://run-shortcut?name=' + encodeURIComponent(P.SHORTCUT_NAME) + '&input=clipboard');
        };
        try {
          navigator.clipboard.writeText(payload).then(go, function () {
            P.toast('Copie impossible : utilisez les boutons « Partager ».', 5000);
          });
        } catch (e) { P.toast('Copie impossible : utilisez les boutons « Partager ».', 5000); }
      };
      act.querySelector('[data-wyes]').onclick = function () {
        jobs.forEach(function (j) { done[j.key] = true; setRow(el, j.key, 'ok', 'Envoyé par le raccourci à ' + j.to.join(', ')); });
        try { navigator.clipboard.writeText(' ').catch(function () {}); } catch (e) {}
        act.querySelector('[data-wend]').click();
      };
      act.querySelector('[data-wno]').onclick = function () {
        ask.hidden = true;
        jobs.forEach(function (j) { if (!done[j.key]) setRow(el, j.key, 'run', 'PDF prêt : réessayez ou touchez « Partager »'); });
      };
      P.$$('[data-wshare]', act).forEach(function (b) {
        b.onclick = function () {
          var j = jobs[Number(b.getAttribute('data-wshare'))], to = j.to.join(', ');
          try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(to).catch(function () {}); } catch (e) {}
          var file = null;
          try { file = new File([j.doc.blob], j.doc.name, { type: 'application/pdf' }); } catch (e) {}
          var p;
          if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            p = navigator.share({ files: [file], title: j.subject || j.label });
          } else {
            var a = document.createElement('a'); a.href = URL.createObjectURL(j.doc.blob); a.download = j.doc.name;
            document.body.appendChild(a); a.click(); a.remove();
            p = Promise.resolve();
          }
          p.then(function () {
            done[j.key] = true; b.disabled = true;
            setRow(el, j.key, 'ok', 'Partagé — destinataire : ' + to);
          }).catch(function (e) {
            if (e && e.name === 'AbortError') { setRow(el, j.key, 'run', 'Partage annulé : touchez à nouveau « Partager »'); return; }
            setRow(el, j.key, 'ko', 'Partage impossible : ' + String((e && e.message) || e));
          });
          P.toast('Adresse copiée : ' + to, 4000);
        };
      });
      act.querySelector('[data-wend]').onclick = function () {
        jobs.forEach(function (j) {
          results.push(done[j.key] ? { job: j, ok: true, info: 'Partagé vers ' + j.to.join(', ') }
            : { job: j, ok: false, failedTo: j.to, info: 'Non partagé' });
          if (!done[j.key]) setRow(el, j.key, 'ko', 'Non partagé');
        });
        act.innerHTML = ''; act.hidden = true;
        resolve();
      };
    });
  }

  function finish(m, jobs, results, el, dlg) {
    P.sending = false;
    var when = new Date().toISOString();
    addLog(results.map(function (r) { return { at: when, om: m.numero, doc: r.job.label, to: r.job.to.join(', '), ok: r.ok, info: r.info }; }));
    m.sendLog = (m.sendLog || []).concat(results.map(function (r) { return { at: when, doc: r.job.key, ok: r.ok, info: r.info }; }));
    var allOk = results.length && results.every(function (r) { return r.ok; });
    if (allOk) m.sentAt = when;
    // Protection des données : le nom des personnes détenues est effacé dès que la décision de fouille est partie
    var fouilleOk = results.some(function (r) { return r.job.key === 'fouille' && r.ok; });
    if (fouilleOk && (m.fouilles || []).some(function (f) { return f.detenu; })) {
      m.fouilles.forEach(function (f) { f.detenu = ''; });
      m.detenusPurgedAt = Date.now(); m.detenusPurgeReason = 'envoi';
    }
    P.saveMissions();

    el.querySelector('h3').textContent = allOk ? 'Mission envoyée' : 'Envoi incomplet';
    el.querySelector('p').textContent = allOk ? 'Tous les documents sont partis.' : 'Certains documents ne sont pas partis. Vous pouvez les envoyer à la main.';
    var act = el.querySelector('#sendActions');
    var failed = results.filter(function (r) { return !r.ok && r.job.doc; });
    act.innerHTML = failed.map(function (r, i) {
      return (sms() ? '<button class="btn" data-msg="' + i + '">Messages : ' + P.esc(r.job.label) + '</button>' : '') +
        '<button class="btn" data-share="' + i + '">Partager : ' + P.esc(r.job.label) + '</button>';
    }).join('') + '<button class="btn btn-primary" data-a="close">Fermer</button>';
    act.hidden = false;
    act.querySelector('[data-a="close"]').onclick = function () { dlg.close(); if (P.refreshHome) P.refreshHome(); };
    P.$$('[data-share]', act).forEach(function (b) {
      b.onclick = function () { var r = failed[Number(b.getAttribute('data-share'))]; P.shareFile(r.job.doc.blob, r.job.doc.name, r.job.label); };
    });
    P.$$('[data-msg]', act).forEach(function (b) {
      b.onclick = function () {
        var r = failed[Number(b.getAttribute('data-msg'))];
        var to = (r.failedTo && r.failedTo.length ? r.failedTo : r.job.to)[0];
        P.blobToBase64(r.job.doc.blob).then(function (b64) {
          return sms().composeSms({ to: to, body: r.job.body, attachments: [{ name: r.job.doc.name, data: b64 }] });
        }).then(function () { P.toast('Adresse copiée : collez-la dans « À » si besoin.', 4000); })
          .catch(function (e) { P.toast('Ouverture de Messages impossible : ' + String((e && e.message) || e), 5000); });
      };
    });
  }
})();

</script>

<script>
/* ===== Écrans et navigation ===== */
/* PREJ Missions — navigation et écrans principaux */
(function () {
  'use strict';
  var P = window.P;
  var $ = P.$, $$ = P.$$, esc = P.esc;
  var MAX_CONTACTS = 5;

  // ---------------------------------------------------------------- enregistrement automatique
  var saveTimer = null;
  P.touch = function (m, now) {
    clearTimeout(saveTimer);
    var run = function () {
      if (P.saveMissions()) {
        var s = document.getElementById('autosave');
        if (s) { s.classList.add('show'); clearTimeout(s._t); s._t = setTimeout(function () { s.classList.remove('show'); }, 1300); }
      }
    };
    if (now) run(); else saveTimer = setTimeout(run, 400);
  };
  function flush() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; P.saveMissions(); } }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('pagehide', flush);

  // ---------------------------------------------------------------- navigation (hash + bouton retour Android)
  var stack = [], replacing = false;
  P.go = function (hash, replace) {
    flush();
    if ((location.hash || '#/') === hash) { route(); return; }
    if (replace) { replacing = true; location.replace(hash); } else { location.hash = hash; }
  };
  function back(parent) {
    flush();
    if (stack.length > 1) history.back(); else P.go(parent || '#/', true);
  }
  window.addEventListener('hashchange', function () {
    var h = location.hash || '#/';
    if (replacing) { replacing = false; stack[Math.max(0, stack.length - 1)] = h; }
    else if (stack.length > 1 && stack[stack.length - 2] === h) stack.pop();
    else if (stack[stack.length - 1] !== h) stack.push(h);
    route();
  });

  function top(o) {
    var bar = $('#topbar');
    bar.innerHTML =
      (o.back ? '<button class="icon-btn" id="tb-back" aria-label="Retour">' + P.ICONS.back + '</button>' : '') +
      '<div class="title"><h1>' + esc(o.title) + '</h1>' + (o.sub ? '<div class="sub">' + esc(o.sub) + '</div>' : '') + '</div>' +
      '<span class="autosave" id="autosave">✓ Enregistré</span>' +
      (o.gear ? '<button class="icon-btn" id="tb-gear" aria-label="Réglages">' + P.ICONS.gear + '</button>' : '');
    if (o.back) $('#tb-back').onclick = function () { back(o.back); };
    if (o.gear) $('#tb-gear').onclick = function () { P.go('#/reglages'); };
  }
  function bar(html) { var a = $('#actionbar'); a.innerHTML = html ? '<div class="actionbar">' + html + '</div>' : ''; }
  function fresh() { var v = $('#view'); var d = document.createElement('div'); v.innerHTML = ''; v.appendChild(d); window.scrollTo(0, 0); return d; }

  function route() {
    P.closeModals();
    var h0 = (location.hash || '#/').replace(/^#\/?/, '');
    document.body.classList.toggle('view-home', h0 === '');
    var parts = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!parts.length) return home();
    if (parts[0] === 'nouvelle') return missionForm(null);
    if (parts[0] === 'reglages') return settings();
    if (parts[0] === 'm') {
      var m = P.getMission(parts[1]);
      if (!m) return P.go('#/', true);
      var sub = parts[2];
      if (!sub) return hub(m);
      if (sub === 'infos') return missionForm(m);
      var titles = { fouille: 'Décision de fouille', retour: 'Fiche retour mission', carnet: 'Carnet de bord' };
      if (!titles[sub]) return P.go('#/m/' + m.id, true);
      top({ title: titles[sub], sub: 'Mission ' + (m.numero || '') + ' · ' + P.frDate(m.date), back: '#/m/' + m.id });
      bar('<div class="in"><button class="btn btn-primary btn-lg" id="b-done">Terminé</button></div>');
      $('#b-done').onclick = function () { back('#/m/' + m.id); };
      return P.views[sub](m, parts[3], fresh());
    }
    P.go('#/', true);
  }

  // ---------------------------------------------------------------- accueil
  function dots(m) {
    var st = P.status(m);
    function d(k, label) { return '<span class="dot ' + (st[k].state === 'ok' ? 'ok' : st[k].state === 'part' ? 'part' : '') + '">' + (st[k].state === 'ok' ? '✓ ' : '') + label + '</span>'; }
    return '<div class="dots">' + d('fouille', 'Fouille') + d('retour', 'Retour') + d('carnet', 'Carnet') + '</div>';
  }
  function home() {
    top({ title: 'PREJ Missions', sub: 'Fouille · Retour mission · Carnet de bord', gear: true });
    var main = fresh();
    var list = P.missions.slice().sort(function (a, b) { return b.createdAt - a.createdAt; });
    if (!list.length) {
      main.innerHTML = '<div class="welcome"><h2>Aucune mission en cours</h2>' +
        '<p>Créez la mission du jour : numéro, chauffeur, chef d\'escorte et agents. Ces informations rempliront automatiquement la décision de fouille, la fiche retour mission et le carnet de bord.</p>' +
        '<button class="btn btn-primary btn-lg btn-block" id="b-new">Créer une nouvelle mission</button></div>' + COPY;
      $('#b-new').onclick = function () { P.go('#/nouvelle'); };
      bar('');
      if (!P.settings.fouilleEmail && !P.settings.retourEmail) setTimeout(function () { P.toast('Pensez à renseigner les destinataires dans la roue dentée.', 4000); }, 600);
      return;
    }
    var sel = '';
    main.innerHTML = '<div id="smsBanner"></div>' +
      '<div class="list-head"><h2>Missions</h2><button class="btn btn-ghost" id="b-new">+ Nouvelle mission</button></div>' +
      list.map(function (m) {
        var badge = m.sentAt ? '<span class="badge sent">Envoyée</span>' : (m.date === P.todayISO() ? '<span class="badge today">Aujourd\'hui</span>' : '');
        return '<div class="mcard' + (m.id === sel ? ' sel' : '') + '">' +
          '<button class="body" data-open="' + m.id + '">' +
            '<div class="l1"><span class="om-chip">' + esc(m.numero || 'Sans n°') + '</span>' + badge + '</div>' +
            '<div class="l2">' + esc(P.frDate(m.date)) + ' · Chef : ' + esc(m.chef || '—') + ' · Chauffeur : ' + esc(m.chauffeur || '—') + '</div>' +
            dots(m) +
          '</button>' +
          '<button class="del" data-del="' + m.id + '" aria-label="Supprimer la mission ' + esc(m.numero || '') + '">' + P.ICONS.trash + '</button></div>';
      }).join('') +
      '<p class="credit">Appuyez sur une mission pour remplir ses documents et les envoyer.</p>' + COPY;
    $('#b-new').onclick = function () { P.go('#/nouvelle'); };
    $$('[data-open]').forEach(function (b) { b.onclick = function () { P.go('#/m/' + b.getAttribute('data-open')); }; });
    $$('[data-del]').forEach(function (b) {
      b.onclick = function () {
        var m = P.getMission(b.getAttribute('data-del'));
        if (!m) return;
        P.confirm('Supprimer la mission ' + (m.numero || '') + '\u00a0?',
          '<p>La mission du ' + esc(P.frDate(m.date)) + ' et tous ses documents, photos et signature seront supprimés de ce téléphone.</p>',
          'Supprimer').then(function (ok) {
          if (!ok) return;
          P.missions = P.missions.filter(function (x) { return x.id !== m.id; });
          P.saveMissions(); P.toast('Mission supprimée.'); home();
        });
      };
    });
    bar('');
    refreshBanner();
  }
  var COPY = '<p class="copyright">© RCZ / PREJ Mrs</p>';
  function refreshBanner() {
    var box = $('#smsBanner');
    if (!box || !P.plugin('SmsComposer')) return;
    P.isSmsGranted().then(function (ok) {
      if (ok) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="missing" style="display:flex;gap:10px;align-items:center"><div style="flex:1"><b>Envoi automatique non activé</b><br>Autorisez l\'envoi des SMS pour que les PDF partent seuls.</div><button class="btn btn-primary" id="b-sms">Activer</button></div>';
      $('#b-sms').onclick = function () { P.startSmsSetup(); };
    });
  }
  P.refreshHome = function () { var h = location.hash || '#/'; if (h === '#/' || h === '#') home(); };

  // ---------------------------------------------------------------- création / modification de mission
  function missionForm(m) {
    var editing = !!m;
    var d = m || { numero: '', date: P.todayISO(), chauffeur: '', chef: P.settings.nom || '', contacts: [''] };
    var contacts = (d.contacts && d.contacts.length ? d.contacts.slice() : ['']);
    top({ title: editing ? 'Mission ' + (m.numero || '') : 'Nouvelle mission', sub: editing ? 'Informations de la mission' : 'Rempli automatiquement dans les 3 documents', back: editing ? '#/m/' + m.id : '#/' });
    var main = fresh();
    function contactRows() {
      return contacts.map(function (c, i) {
        return '<div class="field"><label for="n-c' + i + '">Agent contact ' + (i + 1) + '</label>' +
          '<div class="row-input"><input type="text" id="n-c' + i + '" data-c="' + i + '" value="' + esc(c) + '" autocapitalize="words">' +
          (i > 0 ? '<button type="button" class="rm-btn" data-rmc="' + i + '" aria-label="Retirer cet agent">✕</button>' : '') + '</div></div>';
      }).join('') +
        (contacts.length < MAX_CONTACTS ? '<button type="button" class="link" id="n-addc">+ Ajouter un agent contact (' + (MAX_CONTACTS - contacts.length) + ' possible' + (MAX_CONTACTS - contacts.length > 1 ? 's' : '') + ')</button>' : '');
    }
    main.innerHTML = '<div class="panel">' +
      '<div class="section"><div class="section-title"><span class="section-num">01</span><h3>Mission</h3></div>' +
        '<div class="grid2">' +
          '<div class="field"><label for="n-num">Numéro de mission (OM)</label><input type="text" id="n-num" value="' + esc(d.numero) + '" inputmode="text" autocapitalize="characters"></div>' +
          '<div class="field"><label for="n-date">Date</label><input type="date" id="n-date" value="' + esc(d.date) + '"></div>' +
        '</div></div>' +
      '<div class="section"><div class="section-title"><span class="section-num">02</span><h3>Équipe</h3></div>' +
        '<div class="field"><label for="n-chauf">Chauffeur</label><input type="text" id="n-chauf" value="' + esc(d.chauffeur) + '" autocapitalize="words"></div>' +
        '<div class="field"><label for="n-chef">Chef d\'escorte</label><input type="text" id="n-chef" value="' + esc(d.chef) + '" autocapitalize="words"></div>' +
        (editing ? '<div class="field"><label for="n-qual">Qualité du chef d\'escorte (signature de la fouille)</label><input type="text" id="n-qual" value="' + esc(m.chefQualite) + '"></div>' : '') +
        '<div id="n-contacts">' + contactRows() + '</div>' +
      '</div></div>' +
      '<p class="err" id="n-err" hidden></p>' +
      (editing ? '<button class="btn btn-ghost btn-block" id="n-del" style="color:var(--danger);margin-top:10px">Supprimer la mission</button>' : '');

    function readContacts() { contacts = $$('[data-c]').map(function (i) { return i.value; }); }
    function wireContacts() {
      var add = $('#n-addc');
      if (add) add.onclick = function () { readContacts(); contacts.push(''); $('#n-contacts').innerHTML = contactRows(); wireContacts(); var l = $$('[data-c]'); l[l.length - 1].focus(); if (editing) saveEdit(); };
      $$('[data-rmc]').forEach(function (b) {
        b.onclick = function () { readContacts(); contacts.splice(Number(b.getAttribute('data-rmc')), 1); $('#n-contacts').innerHTML = contactRows(); wireContacts(); if (editing) saveEdit(); };
      });
    }
    wireContacts();
    function values() {
      readContacts();
      return {
        numero: $('#n-num').value.trim(), date: $('#n-date').value || P.todayISO(),
        chauffeur: $('#n-chauf').value.trim(), chef: $('#n-chef').value.trim(),
        contacts: contacts.map(function (c) { return c.trim(); }).filter(Boolean)
      };
    }
    function saveEdit() {
      var v = values();
      m.numero = v.numero; m.date = v.date; m.chauffeur = v.chauffeur; m.chef = v.chef; m.contacts = v.contacts;
      m.chefQualite = $('#n-qual').value.trim();
      P.touch(m);
    }
    if (editing) {
      main.addEventListener('input', saveEdit);
      bar('<div class="in"><button class="btn btn-primary btn-lg" id="n-ok">Terminé</button></div>');
      $('#n-ok').onclick = function () { flush(); back('#/m/' + m.id); };
      $('#n-del').onclick = function () {
        P.confirm('Supprimer la mission ?', '<p>Tous ses documents, photos et signature seront supprimés de ce téléphone.</p>', 'Supprimer').then(function (ok) {
          if (!ok) return;
          P.missions = P.missions.filter(function (x) { return x.id !== m.id; });
          P.saveMissions(); P.toast('Mission supprimée.'); P.go('#/', true);
        });
      };
    } else {
      bar('<div class="in"><button class="btn btn-primary btn-lg" id="n-ok">Créer la mission</button></div>');
      $('#n-ok').onclick = function () {
        var v = values(), miss = [];
        if (!v.numero) miss.push('le numéro de mission');
        if (!v.chauffeur) miss.push('le chauffeur');
        if (!v.chef) miss.push("le chef d'escorte");
        if (miss.length) { var e = $('#n-err'); e.textContent = 'Renseignez ' + miss.join(', ') + '.'; e.hidden = false; return; }
        var nm = P.newMission(v);
        P.missions.push(nm); P.saveMissions();
        P.go('#/m/' + nm.id, true);
      };
    }
  }

  // ---------------------------------------------------------------- page d'une mission
  function hub(m) {
    top({ title: 'Mission ' + (m.numero || 'sans n°'), sub: P.frDate(m.date) + (m.sentAt ? ' · envoyée' : ''), back: '#/' });
    var main = fresh(), st = P.status(m);
    function doc(key, icon, title, s) {
      var cls = s.state === 'ok' ? ' ok' : s.state === 'part' ? ' part' : '';
      return '<button class="doc' + cls + '" data-doc="' + key + '"><span class="ico">' + (s.state === 'ok' ? P.ICONS.check : icon) + '</span>' +
        '<span class="t"><strong>' + title + '</strong><span>' + esc(s.state === 'ok' ? s.label : (s.missing[0] ? 'Manque : ' + s.missing.join(', ') : s.label)) + '</span></span>' +
        '<span class="chev">' + P.ICONS.chev + '</span></button>';
    }
    main.innerHTML =
      '<div class="panel mhead"><div class="l1"><span class="om-chip">' + esc(m.numero || 'Sans n°') + '</span><span style="color:var(--text-muted)">' + esc(P.frDate(m.date)) + '</span>' +
        '<button class="btn btn-ghost" id="h-edit" style="margin-left:auto">Modifier</button></div>' +
        '<dl class="crew"><dt>Chef d\'escorte</dt><dd>' + esc(m.chef || '—') + '</dd><dt>Chauffeur</dt><dd>' + esc(m.chauffeur || '—') + '</dd>' +
        '<dt>Contact(s)</dt><dd>' + esc((m.contacts || []).join(', ') || '—') + '</dd></dl></div>' +
      '<div class="list-head" style="margin-top:16px"><h2>Signature du chef d\'escorte</h2></div>' +
      '<div class="panel" style="padding:12px;display:flex;gap:12px;align-items:center">' +
        (m.signature ? '<div class="sig-preview" style="flex:1"><img src="' + m.signature + '" alt="Signature"></div>' : '<div style="flex:1;color:var(--danger);font-weight:600">Pas encore signée</div>') +
        '<button class="btn" id="h-sign">' + (m.signature ? 'Changer' : 'Signer') + '</button></div>' +
      '<div class="list-head" style="margin-top:16px"><h2>Documents</h2></div>' +
      doc('fouille', P.ICONS.search, 'Décision de fouille', st.fouille) +
      doc('retour', P.ICONS.doc, 'Fiche retour mission', st.retour) +
      doc('carnet', P.ICONS.car, 'Carnet de bord', st.carnet);
    $('#h-edit').onclick = function () { P.go('#/m/' + m.id + '/infos'); };
    $('#h-sign').onclick = function () {
      P.askSignature("Signature de " + (m.chef || "chef d'escorte"), m.signature).then(function (url) {
        if (url === null) return;
        m.signature = url; P.touch(m, true); hub(m);
      });
    };
    $$('[data-doc]').forEach(function (b) { b.onclick = function () { P.go('#/m/' + m.id + '/' + b.getAttribute('data-doc')); }; });
    bar('<div class="in"><button class="btn btn-primary btn-lg" id="h-send">' + (st.allOk ? 'Valider et envoyer les PDF' : 'Envoyer les PDF') + '</button></div>');
    $('#h-send').onclick = function () { P.sendMission(m); };
  }

  // ---------------------------------------------------------------- réglages
  function settings() {
    var s = P.settings;
    top({ title: 'Réglages', back: '#/' });
    bar('');
    var main = fresh();
    var log = P.getLog().slice(0, 12);
    main.innerHTML = '<div class="panel">' +
      '<div class="section"><div class="section-title"><span class="section-num">01</span><h3>Destinataires des PDF (protégés)</h3></div>' +
        '<div class="field"><label>Décision de fouille</label><input type="text" readonly value="' + esc(s.fouilleEmail || 'Non renseigné') + '"></div>' +
        '<div class="field"><label>Fiche retour mission</label><input type="text" readonly value="' + esc(s.retourEmail || 'Non renseigné') + '"></div>' +
        '<div class="field"><label>Carnet de bord</label><input type="text" readonly value="' + esc([P.resp.email1, P.resp.email2].filter(Boolean).join(', ') || 'Non renseigné') + '"></div>' +
        '<div class="field"><label>Unité / établissement par défaut</label><input type="text" readonly value="' + esc(P.resp.origin || 'Non renseigné') + '"></div>' +
        '<div class="field">' +
        '<button class="link" id="s-resp" style="align-self:flex-start">🔒 Modifier (mot de passe responsable)</button></div>' +
      '</div>' +
      '<div class="section"><div class="section-title"><span class="section-num">02</span><h3>Ma signature</h3></div>' +
        '<p class="hint" style="margin:0 0 10px;font-size:13px;color:var(--text-muted)">Reprise automatiquement dans les nouvelles missions où vous êtes chef d\'escorte.</p>' +
        '<div class="grid2"><div class="field"><label for="s-nom">Prénom et nom</label><input type="text" id="s-nom" value="' + esc(s.nom) + '" autocapitalize="words"></div>' +
        '<div class="field"><label for="s-qual">Qualité</label><input type="text" id="s-qual" value="' + esc(s.qualite) + '" placeholder="Premier surveillant, chef d\'escorte"></div></div>' +
        '<div class="panel" style="padding:10px;display:flex;gap:12px;align-items:center;background:var(--panel-2)">' +
          (s.signature ? '<div class="sig-preview" style="flex:1"><img src="' + s.signature + '" alt="Ma signature"></div>' : '<div style="flex:1;color:var(--text-muted)">Aucune signature enregistrée</div>') +
          '<button class="btn" id="s-sign">' + (s.signature ? 'Changer' : 'Signer') + '</button></div>' +
      '</div>' +
      '<div class="section"><div class="section-title"><span class="section-num">03</span><h3>Décision de fouille : remplissage automatique</h3></div>' +
        '<div class="field"><label for="s-lors">« Lors de » par défaut</label><select id="s-lors">' +
          '<option value="">Aucun</option><option value="extraction"' + (s.lors === 'extraction' ? ' selected' : '') + '>Départ en extraction judiciaire</option>' +
          '<option value="transfert"' + (s.lors === 'transfert' ? ' selected' : '') + '>Départ en transfert</option></select></div>' +
        '<div class="checks">' +
          '<label class="check-item' + (s.integrale !== false ? ' on' : '') + '"><input type="checkbox" id="s-int"' + (s.integrale !== false ? ' checked' : '') + '><span>Cocher « Intégrale » automatiquement</span></label>' +
          P.MOTIFS.map(function (x) {
            var on = s.motifs && s.motifs[x[0]];
            return '<label class="check-item' + (on ? ' on' : '') + '"><input type="checkbox" data-smotif="' + x[0] + '"' + (on ? ' checked' : '') + '><span>Motif par défaut : ' + esc(x[1]) + '</span></label>';
          }).join('') + '</div>' +
      '</div>' +
      '<div class="section"><div class="section-title"><span class="section-num">04</span><h3>Affichage</h3></div>' +
        '<div class="seg" style="margin-bottom:12px"><button type="button" data-theme="dark"' + (s.theme !== 'light' ? ' class="on"' : '') + '>Sombre</button><button type="button" data-theme="light"' + (s.theme === 'light' ? ' class="on"' : '') + '>Clair</button></div>' +
        '<div class="swatches">' + P.ACCENTS.map(function (a) {
          return '<button type="button" class="swatch' + (P.validHex(s.accent) === a.hex ? ' sel' : '') + '" data-hex="' + a.hex + '" title="' + a.name + '" aria-label="' + a.name + '" style="background:' + a.hex + '"></button>';
        }).join('') + '</div>' +
      '</div>' +
      (P.plugin('SmsComposer') ? '<div class="section"><div class="section-title"><span class="section-num">05</span><h3>Envoi automatique des MMS</h3></div><div id="s-sms" style="color:var(--text-muted)">Vérification…</div></div>' : '') +
      '<div class="section"><div class="section-title"><span class="section-num">06</span><h3>Derniers envois</h3></div>' +
        (log.length ? '<ul class="log">' + log.map(function (e) {
          var d = new Date(e.at);
          return '<li class="' + (e.ok ? 'ok' : 'ko') + '"><b>' + (e.ok ? '✓ ' : '✗ ') + esc(e.doc) + ' — OM ' + esc(e.om || '') + '</b>' +
            esc(d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })) + ' → ' + esc(e.to) +
            (e.info ? '<br><span style="color:var(--text-muted)">' + esc(e.info) + '</span>' : '') + '</li>';
        }).join('') + '</ul>' : '<p style="margin:0;color:var(--text-muted)">Aucun envoi pour l\'instant.</p>') +
      '</div></div>';

    function email(id, key, err) {
      $(id).addEventListener('input', function () {
        var v = this.value.trim().toLowerCase(), e = $(err);
        if (v && !P.isAllowedEmail(v)) { e.textContent = "L'adresse doit se terminer par @justice.fr"; e.hidden = false; return; }
        e.hidden = true; s[key] = v; P.saveSettings();
      });
    }
    ['nom', 'qual'].forEach(function (k) {
      $('#s-' + k).addEventListener('input', function () { s[{ nom: 'nom', qual: 'qualite' }[k]] = this.value.trim(); P.saveSettings(); });
    });
    $('#s-lors').onchange = function () { s.lors = this.value; P.saveSettings(); };
    main.addEventListener('change', function (e) {
      var t = e.target;
      if (t.type !== 'checkbox') return;
      t.closest('.check-item').classList.toggle('on', t.checked);
      if (t.id === 's-int') s.integrale = t.checked;
      else if (t.hasAttribute('data-smotif')) { s.motifs = s.motifs || {}; s.motifs[t.getAttribute('data-smotif')] = t.checked; }
      P.saveSettings();
    });
    $('#s-sign').onclick = function () {
      P.askSignature('Ma signature', s.signature).then(function (url) { if (url === null) return; s.signature = url; P.saveSettings(); settings(); });
    };
    $$('[data-theme]').forEach(function (b) {
      b.onclick = function () { s.theme = b.getAttribute('data-theme'); P.saveSettings(); P.applyTheme(s.theme, s.accent); $$('[data-theme]').forEach(function (x) { x.classList.toggle('on', x === b); }); };
    });
    $$('[data-hex]').forEach(function (b) {
      b.onclick = function () { s.accent = b.getAttribute('data-hex'); P.saveSettings(); P.applyTheme(s.theme, s.accent); $$('[data-hex]').forEach(function (x) { x.classList.toggle('sel', x === b); }); };
    });
    $('#s-resp').onclick = respGate;
    var smsBox = $('#s-sms');
    if (smsBox) P.isSmsGranted().then(function (ok) {
      smsBox.innerHTML = ok ? '<span style="color:var(--success);font-weight:600">✓ Activé : les PDF partent sans ouvrir Messages.</span>'
        : '<span>Non activé.</span> <button class="btn btn-primary" id="s-smsgo" style="margin-left:8px">Activer</button>';
      var g = $('#s-smsgo'); if (g) g.onclick = function () { P.startSmsSetup(function () { settings(); }); };
    });
  }

  // Paramètres responsable du carnet de bord (mot de passe, comme dans le carnet d'origine)
  function respGate() {
    var g = P.modal('<h3>Accès protégé</h3><p>Entrez le mot de passe pour modifier les paramètres du carnet de bord.</p>' +
      '<div class="field"><label for="pw">Mot de passe</label><input type="password" id="pw" inputmode="numeric" autocomplete="off"></div>' +
      '<div class="actions"><button class="btn" data-a="no">Annuler</button><button class="btn btn-primary" data-a="ok">Valider</button></div>');
    var input = g.el.querySelector('#pw');
    function check() {
      if (input.value === P.RESP_PASSWORD) { g.close(); respEdit(); }
      else { P.toast('Mot de passe incorrect.'); input.value = ''; input.focus(); }
    }
    g.el.querySelector('[data-a="no"]').onclick = g.close;
    g.el.querySelector('[data-a="ok"]').onclick = check;
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
  }
  function respEdit() {
    var r = P.resp, chosen = P.validHex(r.pdfAccent) || '#C9860E', ecu = P.getEcusson();
    function ecuSrc() { return ecu || window.PREJ_IMG.tampon; }
    var e = P.modal('<h3>Paramètres responsable</h3><p>Chaque document part par MMS vers ces adresses, PDF en pièce jointe. Seules les adresses @justice.fr sont acceptées.</p>' +
      '<div class="field"><label for="rf">Décision de fouille</label><input type="email" id="rf" inputmode="email" autocapitalize="off" value="' + esc(P.settings.fouilleEmail) + '" placeholder="prenom.nom@justice.fr"></div>' +
      '<div class="field"><label for="rr">Fiche retour mission</label><input type="email" id="rr" inputmode="email" autocapitalize="off" value="' + esc(P.settings.retourEmail) + '" placeholder="prenom.nom@justice.fr"></div>' +
      '<div class="field"><label for="r1">Carnet de bord</label><input type="email" id="r1" inputmode="email" autocapitalize="off" value="' + esc(r.email1) + '" placeholder="prenom.nom@justice.fr"></div>' +
      '<div class="field"><label for="r2">Carnet de bord : 2e adresse (facultatif)</label><input type="email" id="r2" inputmode="email" autocapitalize="off" value="' + esc(r.email2) + '" placeholder="prenom.nom@justice.fr"></div>' +
      '<div class="field"><label for="ro">Unité</label><input type="text" id="ro" value="' + esc(r.origin) + '"><span class="hint">Sert aussi d\'établissement par défaut dans la décision de fouille.</span></div>' +
      '<div class="field"><label>Couleur du PDF</label><div class="swatches">' + P.ACCENTS.map(function (a) {
        return '<button type="button" class="swatch' + (a.hex === chosen ? ' sel' : '') + '" data-pdf="' + a.hex + '" aria-label="' + a.name + '" style="background:' + a.hex + '"></button>';
      }).join('') + '</div></div>' +
      '<div class="field"><label>Écusson de la fiche retour mission</label>' +
        '<div style="display:flex;gap:12px;align-items:center">' +
          '<div style="width:84px;height:84px;flex:0 0 84px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);display:grid;place-items:center;overflow:hidden">' +
            '<img id="ecu-img" src="' + ecuSrc() + '" alt="Écusson" style="max-width:100%;max-height:100%"></div>' +
          '<div style="display:flex;flex-direction:column;gap:6px;flex:1">' +
            '<label class="btn" for="ecu-file" style="cursor:pointer">Importer un écusson</label>' +
            '<input type="file" id="ecu-file" accept="image/*" class="visually-hidden">' +
            '<button type="button" class="link" id="ecu-reset" style="align-self:flex-start"' + (ecu ? '' : ' hidden') + '>Remettre l\'écusson d\'origine</button>' +
          '</div></div>' +
        '<span class="hint">Image PNG ou JPEG, de préférence carrée. Elle remplace l\'écusson en haut à droite du PDF.</span></div>' +
      '<p class="err" id="r-err" hidden></p>' +
      '<div class="actions"><button class="btn" data-a="no">Annuler</button><button class="btn btn-primary" data-a="ok">Enregistrer</button></div>');
    var ecuImg = e.el.querySelector('#ecu-img'), ecuReset = e.el.querySelector('#ecu-reset');
    e.el.querySelector('#ecu-file').addEventListener('change', function () {
      var f = this.files && this.files[0], input = this;
      if (!f) return;
      P.prepareEcusson(f).then(function (url) { ecu = url; ecuImg.src = url; ecuReset.hidden = false; })
        .catch(function (x) { P.toast(x.message, 4000); })
        .then(function () { input.value = ''; });
    });
    ecuReset.onclick = function () { ecu = ''; ecuImg.src = ecuSrc(); ecuReset.hidden = true; };
    P.$$('[data-pdf]', e.el).forEach(function (b) {
      b.onclick = function () { chosen = b.getAttribute('data-pdf'); P.$$('[data-pdf]', e.el).forEach(function (x) { x.classList.toggle('sel', x === b); }); };
    });
    e.el.querySelector('[data-a="no"]').onclick = e.close;
    e.el.querySelector('[data-a="ok"]').onclick = function () {
      var e1 = e.el.querySelector('#r1').value.trim().toLowerCase(), e2 = e.el.querySelector('#r2').value.trim().toLowerCase(), err = e.el.querySelector('#r-err');
      var ef = e.el.querySelector('#rf').value.trim().toLowerCase(), er = e.el.querySelector('#rr').value.trim().toLowerCase();
      if ((e1 && !P.isAllowedEmail(e1)) || (e2 && !P.isAllowedEmail(e2)) || (ef && !P.isAllowedEmail(ef)) || (er && !P.isAllowedEmail(er))) { err.textContent = 'Seules les adresses @justice.fr sont acceptées.'; err.hidden = false; return; }
      if (!e1 && e2) { e1 = e2; e2 = ''; }
      if (e2 === e1) e2 = '';
      r.email1 = e1; r.email2 = e2; r.origin = e.el.querySelector('#ro').value.trim() || 'PREJ Marseille'; r.pdfAccent = chosen;
      if (ecu !== P.getEcusson() && !P.setEcusson(ecu)) { err.textContent = "Mémoire pleine : impossible d'enregistrer l'écusson."; err.hidden = false; return; }
      P.settings.fouilleEmail = ef; P.settings.retourEmail = er; P.saveSettings();
      P.saveResp(); e.close(); P.toast('Paramètres enregistrés.'); settings();
    };
  }

  // ---------------------------------------------------------------- démarrage
  P.applyTheme(P.settings.theme, P.settings.accent);
  function purge() { P.purgeCache(); if (P.purgeDetenus() && (location.hash || '#/').indexOf('/fouille') > 0) route(); }
  purge();
  setInterval(purge, 30 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') purge(); });
  stack.push(location.hash || '#/');
  route();
})();

</script>
<script>
/* Version web (Safari, écran d'accueil) : garde l'application disponible sans réseau grâce à sw.js, s'il est présent */
if ('serviceWorker' in navigator && !window.Capacitor && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
